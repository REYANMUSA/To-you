plugins {
    id 'com.android.application'
}

android {
    namespace 'com.reyanmusa.amanah'
    compileSdk 36

    defaultConfig {
        applicationId 'com.reyanmusa.amanah'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
}
