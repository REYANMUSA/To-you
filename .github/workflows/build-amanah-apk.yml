name: Build Amanah APK

on:
  push:
    branches:
      - amanah-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Amanah
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle -p android-twa assembleDebug --no-daemon

      - name: Check APK
        run: |
          test -s android-twa/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-twa/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Amanah APK
        uses: actions/upload-artifact@v7
        with:
          name: Amanah-debug-apk
          path: android-twa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
