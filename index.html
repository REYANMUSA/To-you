<script>
const BASE_KEY='toyou_phase5_v1';
let KEY=BASE_KEY;
const SUPABASE_URL=window.TOYOU_SUPABASE_URL||'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY=window.TOYOU_SUPABASE_ANON_KEY||'YOUR_SUPABASE_ANON_KEY';
const REAL_AUTH=typeof supabase!=='undefined' && !SUPABASE_URL.startsWith('YOUR_') && !SUPABASE_ANON_KEY.startsWith('YOUR_');
let sb=REAL_AUTH?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const fresh={profile:{id:'',name:'',email:'',avatar:'',provider:'',accent:'#718c73',visualMode:'classic'},partner:null,screen:'home',theme:'light',tour:false,auth:false,demo:false,signup:false,connected:false,connectionCode:'',habits:[],habitCompletions:{},tasks:[],taskCompletions:{},goals:[],sharedGoals:[],dhikr:0,dhikrDate:'',dhikrCounts:{astaghfirullah:0,subhanallah:0,alhamdulillah:0,la_ilaha_illallah:0},prayer:{Fajr:true,Dhuhr:true,Asr:true,Maghrib:true,Isha:true},hadithLearned:[],dailyHadith:null,quran:{goal:'',progress:0},quranUsDaily:null,quranUsProgress:[],quranUsAyahs:[],courses:[],journey:[],future:[],notes:[],reflections:[],achievements:[],needSent:false,notifications:[],search:'',settings:{notifications:true,dark:false}};
const demoSeed={habits:[{id:'h1',name:'Study for 30 minutes',frequency:'Daily'},{id:'h2',name:'Exercise',frequency:'Daily'},{id:'h3',name:'Read',frequency:'Daily'}],tasks:[{id:'t1',title:"Finish today's work",date:todayKey()},{id:'t2',title:'Review notes',date:todayKey()}],goals:[{id:'g1',title:'Become a better version of myself',progress:42,target:'2027-01-01'},{id:'g2',title:'Build something real',progress:25,target:'2026-12-31'}],quran:{goal:'Read 10 pages a day',progress:4},courses:[{id:'c1',owner:'me',name:'Web Development',progress:35,status:'In progress'}],journey:[{id:'j1',date:'2024-01-01',title:'The day we met',type:'past',desc:'A meaningful beginning.',photo:''}],future:[{id:'f1',title:'Education',desc:'Keep building knowledge.'},{id:'f2',title:'Career',desc:'Become capable of creating real things.'}],dhikr:37,hadithLearned:[1],achievements:['demo'],partner:{name:'Demo Her',email:'her@demo.toyou.app',avatar:'',provider:'demo'},connected:true};
let s=load();
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){
  let out;
  try{out=Object.assign(clone(fresh),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{out=clone(fresh)}
  if(out.dhikrDate!==todayKey()){
    out.dhikr=0;
    out.dhikrCounts={astaghfirullah:0,subhanallah:0,alhamdulillah:0,la_ilaha_illallah:0};
    out.dhikrDate=todayKey();
  }
  out.dhikrCounts=Object.assign({astaghfirullah:0,subhanallah:0,alhamdulillah:0,la_ilaha_illallah:0},out.dhikrCounts||{});
  if(!out.dhikrCounts.astaghfirullah&&out.dhikr)out.dhikrCounts.astaghfirullah=out.dhikr;
  out.dhikr=Object.values(out.dhikrCounts).reduce((a,b)=>a+b,0);
  return out
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}
function switchUserStorage(uid){
  if(!uid){KEY=BASE_KEY;return load()}
  const next=BASE_KEY+':'+uid;
  if(!localStorage.getItem(next)){
    try{
      const legacy=JSON.parse(localStorage.getItem(BASE_KEY)||'null');
      if(legacy?.profile?.id===uid)localStorage.setItem(next,JSON.stringify(legacy));
    }catch{}
  }
  KEY=next;
  return load();
}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function initials(n){return esc((n||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase())} function avatar(n,url=''){return url?`<img class="avatar" src="${esc(url)}" alt="">`:`<div class="avatar fallback">${initials(n)}</div>`}
const LOVE_REMINDER_BASES=['Remember, you are loved. The person beside your heart is working on themselves too.','Someone who cares about you is quietly rooting for you today.','Love can be a reason to grow, not a reason to stop growing.','The future you hope for is built from the small choices you make today.','Remember the good in what you share, and let it give you courage.','You do not need a perfect day. You only need to keep moving forward.','There is someone who wants to see you become stronger, wiser and happier.','Keep your heart soft and your goals strong.','The person you care about is growing too. You are not walking this road alone.','Let today be another brick in the future you hope to build.','Remember that being loved does not mean being carried; it means being encouraged.','Take care of yourself today. Your future self will thank you.','Someone believes in the person you are becoming.','Keep learning. Keep praying. Keep growing. Keep becoming.','Love is sweetest when it inspires patience, character and better choices.','Do one thing today that your future self will be proud of.','Remember the person who makes you smile, and then become someone worth smiling for.','You can miss someone and still use today to become stronger.','Keep your intentions clean and your effort honest.','Your future deserves the version of you that you are building right now.','Remember: progress is attractive, patience is powerful, and consistency matters.','Let love remind you to become better, not to become dependent.','You are allowed to have hard days. Just do not let a hard day become a hard life.','Someone out there is hoping to watch you win in the life you are building.','Keep going. The little improvements are becoming something much bigger.'];const LOVE_REMINDER_ENDINGS=['One day at a time.','Keep going. 🌱','Stay strong and keep your heart steady.','Protect the future you are hoping for.','Let that reminder make you smile today.','Keep your deen, your goals and your character close.','Do the next right thing.','You are becoming better, slowly and surely.','Be patient with yourself and faithful to your effort.','Make today count.','Keep building, quietly and consistently.','Carry that love as encouragement, not pressure.','The small things still matter.','Tomorrow starts with what you do today.','Keep becoming the person you hope to be.'];function dailyLoveReminder(){const day=hadithCourseDay()-1;base=LOVE_REMINDER_BASES[day%LOVE_REMINDER_BASES.length];const end=LOVE_REMINDER_ENDINGS[Math.floor(day/LOVE_REMINDER_BASES.length)%LOVE_REMINDER_ENDINGS.length];const partner=s.partner?.name||'The person you care about';const isHer=s.profile.visualMode==='girl';return isHer?(partner+' loves you. '+base+' '+end):(partner+' loves you. '+base+' '+end)}
function addSpecialDay(){openSheet(modal('Special day or holiday','<p class="muted">Use this for Eid, birthdays, anniversaries, family days or any date you want remembered. It uses the same push system.</p><div class="field"><label>Name</label><input id="specialTitle" placeholder="Eid al-Fitr"></div><div class="field"><label>Date</label><input id="specialDate" type="date"></div><div class="field"><label>Time</label><input id="specialTime" type="time" value="09:00"></div><div class="field"><label>Reminder</label><input id="specialBody" placeholder="A special day worth remembering."></div><label style="display:flex;align-items:center;gap:10px;margin:12px 0"><input id="specialYearly" type="checkbox"> Repeat every year</label><button class="btn" style="width:100%" onclick="saveSpecialDay()">Save special day</button>'));}async function saveSpecialDay(){const title=document.getElementById('specialTitle').value.trim(),date=document.getElementById('specialDate').value,time=document.getElementById('specialTime').value||'09:00',body=document.getElementById('specialBody').value.trim()||'A special day worth remembering.';if(!title||!date)return toast('Add a name and date');const id=crypto.randomUUID(),notifyAt=new Date(date+'T'+time).toISOString(),repeatYearly=document.getElementById('specialYearly').checked;const err=await cloudUpsert('notification_schedules',{id,user_id:s.profile.id,title,body,notify_at:notifyAt,repeat_daily:false,repeat_yearly:repeatYearly,kind:'special_day',enabled:true});if(err)return;closeSheet();render();toast('Special day saved');}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function localDateKey(d=new Date()){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`} function todayKey(){return localDateKey()}
function hadithCourseDay(){const d=new Date();const start=new Date(d.getFullYear(),0,1);return Math.floor((d-start)/86400000)+1}
 function frequencyLabel(f){return ({daily:'Daily',weekly:'Weekly',custom:'Selected days'})[String(f||'daily').toLowerCase()]||String(f)}
function doneOn(type,id,date=todayKey()){let bag=type==='habit'?s.habitCompletions:s.taskCompletions;return !!(bag[id]&&bag[id][date])}
function setDone(type,id,done,date=todayKey()){let bag=type==='habit'?s.habitCompletions:s.taskCompletions;bag[id]=bag[id]||{};if(done)bag[id][date]=true;else delete bag[id][date];save()}
function streakFor(id){let bag=s.habitCompletions[id]||{},n=0,d=new Date();for(let i=0;i<366;i++){let k=new Date(d);k.setDate(d.getDate()-i);let key=localDateKey(k);if(bag[key])n++;else break}return n}
function streakMilestone(n){if(n>=365)return 'Legendary';if(n>=180)return 'Unstoppable';if(n>=100)return 'Century';if(n>=60)return 'Diamond';if(n>=30)return 'Gold';if(n>=14)return 'Strong';if(n>=7)return 'On fire';return 'Building'}
function streakRestoresLeft(){return Math.max(0,3-(s.streakRestoresUsed||0))}
async function restoreStreak(id){if(!sb||!s.auth)return toast('Sign in to use streak restore');if(streakRestoresLeft()<=0)return toast('No restores left this month');const bag=s.habitCompletions[id]||{},d=new Date();d.setDate(d.getDate()-1);const missed=localDateKey(d);if(bag[missed])return toast('Your streak is already safe');const {error}=await sb.from('streak_restores').insert({user_id:s.profile.id,habit_id:id,restored_date:missed});if(error)return toast('Restore failed: '+error.message);bag[missed]=true;s.habitCompletions[id]=bag;s.streakRestoresUsed=(s.streakRestoresUsed||0)+1;save();render();toast('🔥 Streak restored • '+streakRestoresLeft()+' left this month')}
function openStreak(id){const habit=s.habits.find(x=>x.id===id),n=streakFor(id);openSheet(modal('🔥 '+n+' day streak','<div style="text-align:center;padding:8px 0 14px"><div style="font-size:56px;animation:streakPop .65s ease-out">🔥</div><h2 style="margin:6px 0">'+streakMilestone(n)+'</h2><div class="muted">'+esc(habit?.name||'Habit')+' • '+streakRestoresLeft()+' restores left this month</div></div><button class="btn" style="width:100%" onclick="restoreStreak(\''+id+'\')">Restore missed day</button><p class="muted" style="margin-top:10px">3 restores are available each calendar month.</p>'))}
function go(screen){s.screen=screen;save();render()}
function pct(){let all=s.habits.length+s.tasks.length,done=s.habits.filter(x=>doneOn('habit',x.id)).length+s.tasks.filter(x=>doneOn('task',x.id)).length;return all?Math.round(done/all*100):0}

function modal(title,body){return `<div class="modal" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="row"><h2 style="margin:0">${title}</h2><button class="icon" onclick="closeSheet()">×</button></div>${body}</div></div>`}

let authQueue=Promise.resolve();
let needChannel=null;
async function showNeedNotification(name){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  try{
    const reg=await navigator.serviceWorker.ready;
    await reg.showNotification('I Need You',{body:(name||'She')+' sent you an I Need You signal.',tag:'to-you-need-you'});
    setTimeout(()=>reg.showNotification('I Need You',{body:(name||'She')+' still needs you.',tag:'to-you-need-you-repeat'}),1400);
  }catch{}
}
const WEB_PUSH_PUBLIC_KEY=window.TOYOU_VAPID_PUBLIC_KEY||'';
function urlBase64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4);const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));}
async function registerWebPushSubscription(){
  if(!sb||!s.auth||!('serviceWorker' in navigator)||!('PushManager' in window))return false;
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(WEB_PUSH_PUBLIC_KEY)});
    const json=sub.toJSON(), endpoint=json.endpoint||sub.endpoint, p256dh=json.keys?.p256dh, auth=json.keys?.auth;
    if(!endpoint||!p256dh||!auth)return false;
    const {error}=await sb.from('push_subscriptions').upsert({user_id:s.profile.id,endpoint,p256dh,auth,user_agent:navigator.userAgent,updated_at:new Date().toISOString()},{onConflict:'user_id,endpoint'});
    if(error){toast('Push setup could not sync: '+error.message);return false}
    return true;
  }catch(e){toast('Push setup failed: '+(e?.message||e));return false}
}
async function enableNotifications(){
  if(!('Notification' in window))return false;
  const p=await Notification.requestPermission();
  if(p!=='granted'){s.settings.notifications=false;save();render();return false}
  s.settings.notifications=true;save();render();
  const pushed=await registerWebPushSubscription();
  toast(pushed?'Phone notifications enabled':'Notifications enabled; push setup needs connection');
  return true;
}
function startNeedRealtime(uid){
  if(!sb||!uid)return;
  if(needChannel)sb.removeChannel(needChannel);
  needChannel=sb.channel('to-you-need-'+uid).on('postgres_changes',{event:'INSERT',schema:'public',table:'need_you_requests',filter:'recipient_id=eq.'+uid},payload=>{
    const row=payload.new||{};
    if(row.sender_id===uid)return;
    s.notifications.unshift({id:row.id,text:'I Need You signal',date:row.created_at,status:'sent'});
    save();render();
    if(s.settings.notifications)showNeedNotification(s.partner?.name||'She');
  }).subscribe();
}

let lastQueuedUserId='__unset__';
function queueAuthSession(session){
  const uid=session?.user?.id||'__signed_out__';
  if(uid===lastQueuedUserId)return;
  lastQueuedUserId=uid;
  authQueue=authQueue.then(async()=>{
    if(session)await hydrateUser(session.user);
    else if(!s.demo){
      KEY=BASE_KEY;
      s=clone(fresh);
      render();
    }
  }).catch(e=>toast('Session sync error: '+(e?.message||e)));
}
function initAuth(){
  if(!sb){render();return}
  sb.auth.onAuthStateChange((_event,session)=>{
    setTimeout(()=>queueAuthSession(session),0);
  });
  sb.auth.getSession().then(({data})=>queueAuthSession(data.session)).catch(e=>toast('Could not restore session: '+e.message));
}
async function cloudUpsert(table,row){
  if(!sb||!s.auth)return null;
  const r=await sb.from(table).upsert(row);
  if(r.error)toast('Sync error: '+r.error.message);
  return r.error||null;
}
async function cloudDelete(table,id){
  if(!sb||!s.auth)return null;
  const r=await sb.from(table).delete().eq('id',id);
  if(r.error)toast('Sync error: '+r.error.message);
  return r.error||null;
}
async function hydrateCoreData(){
  if(!sb||!s.auth)return;
  const uid=s.profile.id;
  const today=todayKey();
  const [h,t,g,hg,j,hc,tc,sg,nr,jm,dd,pr,co,no,qo,re,hp,hd]=await Promise.all([
    sb.from('habits').select('*').eq('user_id',uid).eq('archived',false),
    sb.from('tasks').select('*').eq('user_id',uid).eq('archived',false),
    sb.from('goals').select('*').eq('user_id',uid),
    sb.from('goals').select('*').eq('shared_with_partner',true).neq('user_id',uid),
    sb.from('journey_events').select('*').order('event_date',{ascending:true}),
    sb.from('habit_completions').select('habit_id,completed_on').eq('owner_user_id',uid),
    sb.from('task_completions').select('task_id,completed_on').eq('owner_user_id',uid),
    sb.from('shared_goals').select('*').order('created_at',{ascending:true}),
    sb.from('need_you_requests').select('id,sender_id,status,created_at').eq('recipient_id',uid).order('created_at',{ascending:false}).limit(20),
    sb.from('journey_media').select('journey_event_id,storage_path').order('created_at',{ascending:false}),
    sb.from('dhikr_daily').select('*').eq('user_id',uid).eq('dhikr_date',today).maybeSingle(),
    sb.from('prayer_settings').select('*').eq('user_id',uid).maybeSingle(),
    sb.from('courses').select('*').order('created_at',{ascending:true}),
    sb.from('notes').select('*').eq('user_id',uid).order('created_at',{ascending:false}),
    sb.from('quran_goals').select('*').eq('user_id',uid).order('created_at',{ascending:false}),
    sb.from('reflections').select('*').eq('user_id',uid).order('reflection_date',{ascending:false}).limit(100),
    sb.from('hadith_progress').select('hadith_id,first_learned_at,mastered').eq('user_id',uid),
    sb.from('hadiths').select('*').eq('verified',true).eq('course_day',hadithCourseDay()).in('collection',['sahih_bukhari','sahih_muslim']).maybeSingle()
  ]);

  if(h.error)toast('Could not load habits: '+h.error.message);else s.habits=(h.data||[]).map(x=>({id:x.id,name:x.name||x.title,frequency:frequencyLabel(x.frequency)}));
  if(t.error)toast('Could not load tasks: '+t.error.message);else s.tasks=(t.data||[]).map(x=>({id:x.id,title:x.title,date:x.due_date||'Today'}));
  if(g.error)toast('Could not load goals: '+g.error.message);else s.goals=(g.data||[]).map(x=>({id:x.id,title:x.title,progress:x.progress,target:x.target_date||'',desc:x.description||'',shared:x.shared_with_partner}));
  if(hg.error)toast('Could not load shared goals: '+hg.error.message);else s.herGoals=(hg.data||[]).map(x=>({id:x.id,title:x.title,progress:x.progress,target:x.target_date||'',desc:x.description||''}));
  if(j.error)toast('Could not load Journey: '+j.error.message);else s.journey=(j.data||[]).map(x=>({id:x.id,title:x.title,date:x.event_date,type:x.time_position,desc:x.description||'',photo:x.photo_url||''}));

  s.habitCompletions={};
  if(!hc.error)(hc.data||[]).forEach(x=>(s.habitCompletions[x.habit_id]??={})[x.completed_on]=true);else toast('Could not load habit progress: '+hc.error.message);
  s.taskCompletions={};
  if(!tc.error)(tc.data||[]).forEach(x=>(s.taskCompletions[x.task_id]??={})[x.completed_on]=true);else toast('Could not load task progress: '+tc.error.message);

  if(sg.error)toast('Could not load shared goals: '+sg.error.message);
  else s.sharedGoals=(sg.data||[]).map(x=>({id:x.id,title:x.title,desc:x.description||'',progress:x.progress||0,coupleId:x.couple_id,category:x.category||'future'}));

  if(!nr.error){
    const old=s.notifications||[];
    s.notifications=(nr.data||[]).map(x=>({id:x.id,text:'You received an I Need You signal.',date:x.created_at,status:x.status})).concat(old.filter(x=>!x.status));
  }else toast('Could not load signals: '+nr.error.message);

  if(!jm.error&&jm.data?.length){
    await Promise.all(jm.data.map(async m=>{
      const signed=await sb.storage.from('journey-media').createSignedUrl(m.storage_path,60*60*24*30);
      const row=s.journey.find(x=>x.id===m.journey_event_id);
      if(row&&signed.data?.signedUrl)row.photo=signed.data.signedUrl;
    }));
  }else if(jm.error)toast('Could not load Journey photos: '+jm.error.message);

  if(!dd.error&&dd.data){
    s.dhikrCounts={
      astaghfirullah:dd.data.astaghfirullah||0,
      subhanallah:dd.data.subhanallah||0,
      alhamdulillah:dd.data.alhamdulillah||0,
      la_ilaha_illallah:dd.data.la_ilaha_illallah||0
    };
    s.dhikr=Object.values(s.dhikrCounts).reduce((a,b)=>a+b,0);
    s.dhikrDate=today;
  }else if(dd.error)toast('Could not load Dhikr: '+dd.error.message);

  if(!pr.error&&pr.data){
    s.prayer={
      Fajr:!!pr.data.fajr_enabled,
      Dhuhr:!!pr.data.dhuhr_enabled,
      Asr:!!pr.data.asr_enabled,
      Maghrib:!!pr.data.maghrib_enabled,
      Isha:!!pr.data.isha_enabled
    };
  }else if(pr.error)toast('Could not load prayer reminders: '+pr.error.message);

  if(!co.error)s.courses=(co.data||[]).map(x=>({id:x.id,name:x.title,owner:x.user_id===uid?'me':'her',progress:x.progress||0,status:x.status||'In progress',coupleId:x.couple_id}));else toast('Could not load courses: '+co.error.message);
  if(!no.error)s.notes=(no.data||[]).map(x=>({id:x.id,title:x.title,body:x.body,date:x.created_at}));else toast('Could not load notes: '+no.error.message);
  if(!qo.error)s.quranGoals=(qo.data||[]).map(x=>({id:x.id,title:x.title,target:x.target||'',progress:x.progress||0}));else toast('Could not load Qur’an goals: '+qo.error.message);
  if(!re.error)s.reflections=(re.data||[]).map(x=>{let v={};try{v=JSON.parse(x.content||'{}')}catch{}return {id:x.id,date:x.reflection_date,good:v.good||'',improve:v.improve||'',grateful:v.grateful||''}});else toast('Could not load reflections: '+re.error.message);
  if(!hp.error)s.hadithLearned=(hp.data||[]).filter(x=>x.mastered||x.first_learned_at).map(x=>x.hadith_id);else toast('Could not load Hadith progress: '+hp.error.message);
  if(!hd.error)s.dailyHadith=hd.data||null;else s.dailyHadith=null;

  save();render();
}
async function hydrateUser(user){
  switchUserStorage(user.id);
  let {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(error)return toast(error.message);
  if(!p){
    let name=user.user_metadata?.full_name||user.email?.split('@')[0]||'New user';
    let ins=await sb.from('profiles').insert({id:user.id,display_name:name,avatar_url:user.user_metadata?.avatar_url||null});
    if(ins.error)return toast(ins.error.message);
    p={id:user.id,display_name:name,avatar_url:user.user_metadata?.avatar_url||null,visual_mode:'classic',dark_mode:false,notifications:true,tour_completed:false};
  }
  s.profile={
    id:p.id,name:p.display_name||'Your profile',email:user.email||'',avatar:p.avatar_url||'',provider:'google/email',visualMode:p.visual_mode||'classic'
  };
  s.theme=p.dark_mode?'dark':'light';
  s.settings.notifications=p.notifications!==false;
  s.auth=true;s.demo=false;s.tour=p.tour_completed!==true;
  save();
  startNeedRealtime(user.id);
  const monthStart=new Date(); monthStart.setUTCDate(1); monthStart.setUTCHours(0,0,0,0);
  const rr=await sb.from('streak_restores').select('id',{count:'exact',head:true}).eq('user_id',user.id).gte('created_at',monthStart.toISOString());
  s.streakRestoresUsed=rr.count||0;
  await refreshPartner();
  await hydrateCoreData();
}
function connectSheet(){openSheet(modal('Connect with Her',`<p class="muted">Connect only when both of you intentionally choose to. Private data stays private.</p><div class="field"><label>Her connection code</label><input id="connectCode" placeholder="TOYOU-7K4P-92" autocapitalize="characters"></div><button class="btn" style="width:100%" onclick="redeemCode()">Connect</button><div class="or"><span>or</span></div><button class="btn secondary" style="width:100%" onclick="createCode()">Create my code</button><div id="codeBox" class="empty"></div>`))}
async function createCode(){if(!sb||!s.auth)return toast('Real account required');let {data,error}=await sb.rpc('create_connection_code');if(error)return toast(error.message);document.getElementById('codeBox').innerHTML=`<strong>Your code</strong><div class="big" style="font-size:25px;margin-top:8px">${esc(data)}</div><div class="muted">Give this code to the person you want to connect with.</div>`}
async function redeemCode(){let code=document.getElementById('connectCode').value.trim().toUpperCase();if(!code)return toast('Enter a code');if(!sb||!s.auth)return toast('Real account required');let {data,error}=await sb.rpc('redeem_connection_code',{p_code:code});if(error)return toast(error.message);closeSheet();await refreshPartner();await hydrateCoreData();toast('Connected safely')}
async function refreshPartner(){
  if(!sb||!s.auth)return false;
  const previous=s.partner;
  const {data,error}=await sb.rpc('get_my_connection');
  if(error){
    if(previous?.id&&previous?.coupleId){s.partner=previous;s.connected=true}
    else s.connected=false;
    save();render();
    return !!previous;
  }
  if(data&&data.length){
    const p=data[0];
    s.partner={id:p.partner_id,coupleId:p.couple_id,name:p.partner_name||'Her',avatar:p.partner_avatar||'',email:'',provider:''};
    s.connected=true;
  }else{
    s.partner=null;
    s.connected=false;
  }
  save();render();
  return s.connected;
}
async function toggleItem(type,id){let kind=type==='habits'?'habit':'task';let done=!doneOn(kind,id);setDone(kind,id,done);if(sb&&s.auth){const table=kind==='habit'?'habit_completions':'task_completions';const key=kind==='habit'?'habit_id':'task_id';if(done)await cloudUpsert(table,{[key]:id,owner_user_id:s.profile.id,completed_on:todayKey()});else await sb.from(table).delete().eq(key,id).eq('owner_user_id',s.profile.id).eq('completed_on',todayKey())}if(done&&kind==='habit')toast('Habit completed ✓');render()}

function addGoal(){openSheet(modal('Create goal',`<div class="field"><label>Goal</label><input id="newGoal" placeholder="What are you building toward?"><div class="grid3" style="margin-top:8px"><button class="btn ghost" type="button" onclick="newGoal.value='Build a skill'">Build a skill</button><button class="btn ghost" type="button" onclick="newGoal.value='Improve my Deen'">Improve my Deen</button><button class="btn ghost" type="button" onclick="newGoal.value='Build something real'">Build something real</button></div></div><div class="field"><label>Description</label><textarea id="goalDesc" placeholder="Why does this matter?"></textarea></div><div class="field"><label>Target date</label><input id="goalDate" type="date"></div><button class="btn" style="width:100%" onclick="createGoal()">Create goal</button>`))}

async function saveGoalEdit(id){let g=s.goals.find(x=>x.id===id);if(!g)return;g.progress=+gprogress.value;g.shared=document.getElementById('gshare')?.classList.contains('on');const err=await cloudUpsert('goals',{id:g.id,user_id:s.profile.id,owner_user_id:s.profile.id,title:g.title,description:g.desc||'',progress:g.progress,target_date:g.target||null,shared_with_partner:g.shared});if(err)return;save();closeSheet();render();toast('Goal saved')}
async function setPrayer(key){
  s.prayer[key]=!s.prayer[key];save();render();closeSheet();prayer();

    user_id:s.profile.id,
    reminders_enabled:Object.values(s.prayer).some(Boolean),
    fajr_enabled:!!s.prayer.Fajr,
    dhuhr_enabled:!!s.prayer.Dhuhr,
    asr_enabled:!!s.prayer.Asr,
    maghrib_enabled:!!s.prayer.Maghrib,
    isha_enabled:!!s.prayer.Isha
  });

  if(r.error){toast('Could not save Qur’an progress: '+r.error.message);return}
  const rest=s.quranUsProgress.filter(x=>!(x.user_id===s.profile.id&&x.quran_date===date));if(row.pages_completed===3)rest.push(row);s.quranUsProgress=rest;save();render();toast(row.pages_completed===3?'3 pages completed ✓':'Marked incomplete');
}
function addMeaningfulAyah(){
  if(!sb||!s.auth)return toast('Sign in to use shared Qur’an');if(!s.connected||!s.partner?.coupleId)return toast('Connect first');
  openSheet(modal('Save a meaningful ayah',`<p class="muted">Save an ayah that meant something to you. It will be shared with her.</p><div class="field"><label>Surah</label><input id="ayahSurah" placeholder="Al-Baqarah"></div><div class="field"><label>Ayah number</label><input id="ayahNumber" type="number" min="1" placeholder="286"></div><div class="field"><label>Arabic</label><textarea id="ayahArabic" placeholder="Paste the exact Arabic ayah"></textarea></div><div class="field"><label>Translation</label><textarea id="ayahTranslation" placeholder="Paste the translation you trust"></textarea></div><div class="field"><label>Why it was meaningful <span class="muted">(optional)</span></label><textarea id="ayahNote" placeholder="A short reflection..."></textarea></div><button class="btn" style="width:100%" onclick="saveMeaningfulAyah()">Save ayah</button>`));
}
async function saveMeaningfulAyah(){
  const surah=document.getElementById('ayahSurah').value.trim(),ayah=+document.getElementById('ayahNumber').value,arabic=document.getElementById('ayahArabic').value.trim(),translation=document.getElementById('ayahTranslation').value.trim(),note=document.getElementById('ayahNote').value.trim();
  if(!surah||!ayah||!arabic||!translation)return toast('Add the reference, Arabic and translation');
  const id=crypto.randomUUID(),row={id,couple_id:s.partner.coupleId,created_by:s.profile.id,surah,ayah,arabic,translation,note};
  const r=await sb.from('quran_ayah_notes').insert(row);if(r.error){toast('Could not save ayah: '+r.error.message);return}
  s.quranUsAyahs=[row,...(s.quranUsAyahs||[])];save();closeSheet();render();toast('Ayah saved for Us');
}
function quranTogether(){
  const date=todayKey(),daily=s.quranUsDaily||{target_pages:3},rows=s.quranUsProgress||[],me=rows.find(x=>x.user_id===s.profile.id&&x.quran_date===date),her=rows.find(x=>x.user_id===s.partner?.id&&x.quran_date===date),meDone=me?.pages_completed===3,herDone=her?.pages_completed===3;
  return `<main class="page"><button class="back" onclick="go('deenTogether')">‹ Deen Together</button><div class="quranUsHero"><div><h1 style="margin-bottom:3px">Qur’an</h1><div class="muted">A small shared practice, one day at a time.</div></div><div class="quranUsIcon">☪</div></div><section class="card"><div class="row"><div><strong>Today’s Muraaja’ah</strong><div class="muted">Review ${daily.target_pages||3} pages</div></div><span class="pill">${meDone?'Done':'3 pages'}</span></div><div class="quranUsPeople" style="margin-top:12px"><div class="quranUsPerson"><div class="row"><div><strong>${esc(s.profile.name||'You')}</strong><div class="muted">Your review</div></div><span class="${meDone?'quranUsDone':''}">${meDone?'✓ 3/3':'0/3'}</span></div><div class="progress" style="margin-top:9px"><i style="width:${meDone?100:0}%"></i></div></div><div class="quranUsPerson"><div class="row"><div><strong>${esc(s.partner?.name||'Her')}</strong><div class="muted">Her review</div></div><span class="${herDone?'quranUsDone':''}">${herDone?'✓ 3/3':'0/3'}</span></div><div class="progress" style="margin-top:9px"><i style="width:${herDone?100:0}%"></i></div></div></div><button class="btn ${meDone?'secondary':''}" style="width:100%;margin-top:12px" onclick="toggleQuranMuraajaah()">${meDone?'Undo today’s 3 pages':'Mark today’s 3 pages done'}</button></section><section class="card"><div class="row"><div><strong>Meaningful ayahs</strong><div class="muted">Save a verse you want both of you to remember.</div></div><button class="btn secondary" onclick="addMeaningfulAyah()">+ Add</button></div>${quranUsAyahCountPlaceholder()}</section></main>`;
}
function quranUsAyahCountPlaceholder(){const ayahs=s.quranUsAyahs||[];if(!ayahs.length)return '<div class="empty">Nothing saved yet.</div>';return '<div class="stack" style="margin-top:12px">'+ayahs.map(a=>`<section class="quranUsAyah"><div class="quranUsRef">${esc(a.surah)} · ${esc(a.ayah)}</div><p class="quranUsArabic" dir="rtl">${esc(a.arabic)}</p><div>${esc(a.translation)}</div>${a.note?`<div class="muted quranUsNote">${esc(a.note)}</div>`:''}<div class="muted small" style="margin-top:10px">Added by ${a.created_by===s.profile.id?'you':esc(s.partner?.name||'her')}</div></section>`).join('')+'</div>'}
function us(){
  // Shared Qur’an is intentionally kept inside Us, not Deen.
let connected=!!(s.connected&&s.partner);let partner=connected?avatar(s.partner.name,s.partner.avatar):'<div class=\"avatar fallback\">?</div>';return '<main class=\"page\"><h1>Us</h1><section class=\"card people\"><div class=\"person\">'+avatar(s.profile.name,s.profile.avatar)+'<strong>'+esc(s.profile.name||'You')+'</strong><span class=\"muted\">Me</span></div><div class=\"connectionLine\">'+(connected?'↔':'+')+'</div><div class=\"person\">'+partner+'<strong>'+(connected?esc(s.partner.name):'Not connected')+'</strong><span class=\"muted\">'+(connected?'Her':'Connect when ready')+'</span></div></section>'+(connected?'':'<section class=\"card center\"><h3>Connect your two accounts</h3><p class=\"muted\">Your private data stays yours. Only things intentionally shared appear in Us.</p><button class=\"btn\" onclick=\"connectSheet()\">Connect with Her</button></section>')+'<section class=\"card\"><strong>Grow</strong><div class=\"grid2\" style=\"margin-top:12px\"><button class=\"btn secondary\" onclick=\"go(\'grow\')\">My Goals</button><button class=\"btn secondary\" onclick=\"go(\'grow\')\">Her Goals</button></div><button class=\"btn\" style=\"width:100%;margin-top:10px\" onclick=\"go(\'ourg\')\">Our Goals</button></section><section class=\"card\" onclick=\"go(\'courses\')\"><strong>Courses</strong><div class=\"muted\">Mine · Hers · shared achievements</div></section><section class=\"card\" onclick=\"go(\'deenTogether\')\"><strong>Deen Together</strong><div class=\"muted\">Qur’an · Hadith · Dhikr · Islamic learning</div></section><section class=\"card\" onclick=\"go(\'future\')\"><strong>Future</strong><div class=\"muted\">Marriage · family · children · education · career · finances</div></section><section class=\"card\" onclick=\"go(\'journey\')\"><strong>Our Journey</strong><div class=\"muted\">Past · Present · Future · calendar · milestones</div></section><section class=\"card center\"><div class=\"big\">🫂</div><h3>I Need You</h3><div class=\"muted\">A quiet signal when you genuinely need her.</div><button class=\"btn\" '+(connected?'':'disabled')+' onclick=\"'+(connected?'need()':"toast('Connect first')")+'\">'+(connected?(s.needSentAt?'Send again':'I Need You'):'Connect first')+'</button></section></main>'}
function grow(){let connected=!!(s.connected&&s.partner);let mine=s.goals.map(function(g){return '<button class="listBtn" style="margin-top:10px" onclick="editGoal(\''+g.id+'\')"><div class="row"><span>'+esc(g.title)+'</span><span>'+g.progress+'%</span></div><div class="progress" style="margin-top:8px"><i style="width:'+g.progress+'%"></i></div></button>'}).join('');let hers=(s.herGoals||[]).map(g=>'<section class="item" style="margin-top:10px"><div class="row"><span>'+esc(g.title)+'</span><span>'+g.progress+'%</span></div><div class="muted">'+esc(g.desc||'Shared by her')+'</div></section>').join('');let shared=s.sharedGoals.map(g=>'<p>• '+esc(g.title)+'</p>').join('');return '<main class="page"><button class="back" onclick="go(\'us\')">‹ Us</button><h1>Grow</h1><section class="card"><strong>My Goals</strong><div class="muted">Your private goals. Only you control them.</div>'+(mine||'<div class="empty">No goals yet.</div>')+'<button class="btn secondary" style="margin-top:10px" onclick="addGoal()">+ My Goal</button></section><section class="card"><strong>Her Goals</strong><div class="muted">Only goals she intentionally shares with you.</div>'+(connected?(hers||'<div class="empty">She has not shared a goal yet.</div>'):'<div class="empty">Connect first. Nothing is exposed automatically.</div>')+'</section><section class="card"><strong>Our Goals</strong><div class="muted">Goals you intentionally build together.</div>'+(shared||'<div class="empty">No shared goals yet.</div>')+'<button class="btn" style="margin-top:10px" onclick="addSharedGoal()">+ Our Goal</button></section></main>'}
function ourg(){let shared=s.sharedGoals.map(function(g){return '<section class=\"card\"><div class=\"row\"><strong>'+esc(g.title)+'</strong><span>'+(g.progress||0)+'%</span></div><div class=\"muted\">'+esc(g.desc||'Shared goal')+'</div><div class=\"progress\" style=\"margin-top:12px\"><i style=\"width:'+(g.progress||0)+'%\"></i></div></section>'}).join('');return '<main class=\"page\"><button class=\"back\" onclick=\"go(\'grow\')\">‹ Grow</button><div class=\"row\"><h1>Our Goals</h1><button class=\"btn secondary\" onclick=\"addSharedGoal()\">+ Add</button></div>'+(shared||'<section class=\"card center\"><div class=\"big\">🌱</div><h3>Build something together</h3><p class=\"muted\">Create your first shared goal when you’re ready.</p></section>')+'</main>'}
function addSharedGoal(){openSheet(modal('Our goal',`<div class="field"><label>Goal</label><input id="sharedGoal" placeholder="What are we building toward?"></div><div class="field"><label>Description</label><textarea id="sharedDesc" placeholder="Why does this matter?"></textarea></div><button class="btn" style="width:100%" onclick="createSharedGoal()">Create shared goal</button>`))}
async function createSharedGoal(){let n=document.getElementById('sharedGoal').value.trim();if(!n)return;if(!s.connected||!s.partner?.coupleId)return toast('Connect first');let id=crypto.randomUUID(),desc=document.getElementById('sharedDesc').value.trim();s.sharedGoals.push({id,title:n,desc,progress:0,coupleId:s.partner.coupleId});if(sb&&s.auth){let err=await cloudUpsert('shared_goals',{id,couple_id:s.partner.coupleId,title:n,description:desc,progress:0,created_by:s.profile.id});if(err){s.sharedGoals=s.sharedGoals.filter(x=>x.id!==id);return}}save();closeSheet();render();toast('Shared goal created')}
function courses(){return `<main class="page"><button class="back" onclick="go('us')">‹ Us</button><div class="row"><h1>Courses</h1><button class="btn secondary" onclick="course()">+ Add</button></div>${s.courses.map(c=>`<section class="card"><div class="row"><div><strong>${esc(c.name)}</strong><div class="muted">${c.owner==='me'?'Mine':'Hers'} · ${c.status}</div></div><span>${c.progress}%</span></div><div class="progress" style="margin-top:10px"><i style="width:${c.progress}%"></i></div>${c.progress>=100?'<span class="pill" style="margin-top:10px">Shared achievement unlocked</span>':''}</section>`).join('')}</main>`}
function deenTogether(){return `<main class="page"><button class="back" onclick="go('us')">‹ Us</button><h1>Deen Together</h1><section class="card" onclick="openQuranTogether()"><div class="row"><div><strong>Qur’an</strong><div class="muted">3-page daily muraaja’ah · meaningful ayahs</div></div><span class="pill">Together</span></div></section><section class="card"><strong>Hadith</strong><div class="muted">Memorization progress</div></section><section class="card"><strong>Dhikr</strong><div class="muted">Intentional shared milestones</div></section><section class="card"><strong>Islamic Learning</strong><div class="muted">Lessons and challenges</div></section></main>`}
function future(){return `<main class="page"><button class="back" onclick="go('us')">‹ Us</button><h1>Future</h1>${s.future.map(x=>`<section class="card"><strong>${esc(x.title)}</strong><div class="muted">${esc(x.desc)}</div></section>`).join('')}<section class="card"><strong>Before marriage</strong><div class="muted">Things we want to accomplish before marriage and who we want to become.</div></section></main>`}
function journeyPage(){return `<main class="page"><button class="back" onclick="go('us')">‹ Us</button><div class="row"><h1>Our Journey</h1><button class="btn secondary" onclick="addJourney()">+ Add</button></div><div class="pill">Past · Present · Future</div>${s.journey.sort((a,b)=>a.date.localeCompare(b.date)).map(j=>`<section class="card"><div class="row"><span class="pill">${esc(j.type)}</span><span class="muted">${esc(j.date)}</span></div><h3>${esc(j.title)}</h3><div class="muted">${esc(j.desc)}</div>${j.photo?`<img class="journeyPhoto" src="${esc(j.photo)}" alt="Journey photo">`:''}<button class="btn ghost" style="margin-top:12px;width:100%" onclick="deleteJourneyEvent('${j.id}')">Delete memory</button></section>`).join('')}</main>`}
function notes(){return `<main class="page"><div class="row"><h1>Notes</h1><button class="btn secondary" onclick="addNote()">+ New</button></div>${s.notes.length?s.notes.map(n=>`<section class="card"><strong>${esc(n.title)}</strong><p class="muted">${esc(n.body)}</p></section>`).join(''):'<div class="empty">Private notes live here.</div>'}</main>`}
function searchPage(){let q=s.search.toLowerCase();let all=[...s.habits.map(x=>({t:x.name,c:'Habit'})),...s.tasks.map(x=>({t:x.title,c:'Task'})),...s.goals.map(x=>({t:x.title,c:'Goal'})),...s.courses.map(x=>({t:x.name,c:'Course'})),...s.journey.map(x=>({t:x.title,c:'Journey'})),...s.notes.map(x=>({t:x.title,c:'Note'}))];let r=all.filter(x=>!q||x.t.toLowerCase().includes(q));return `<main class="page"><h1>Search</h1><div class="field"><input id="searchInput" value="${esc(s.search)}" oninput="search()" placeholder="Search habits, tasks, goals, courses, journey..."></div>${r.map(x=>`<div class="item" style="margin:8px 0"><strong>${esc(x.t)}</strong><div class="muted">${x.c}</div></div>`).join('')||'<div class="empty">Nothing found.</div>'}</main>`}
async function persistPreferences(){
  if(!sb||!s.auth)return;
  const {error}=await sb.from('profiles').update({
    visual_mode:s.profile.visualMode||'classic',
    dark_mode:s.theme==='dark',
    notifications:!!s.settings.notifications,
    updated_at:new Date().toISOString()
  }).eq('id',s.profile.id);
  if(error)toast('Settings could not sync: '+error.message);
}
async function setThemeMode(){s.theme=s.theme==='dark'?'light':'dark';save();render();await persistPreferences()}
async function setVisualMode(mode){s.profile.visualMode=mode==='girl'?'girl':'classic';save();render();await persistPreferences()}
async function setNotifications(){if(!s.settings.notifications){const ok=await enableNotifications();if(!ok)return}else{s.settings.notifications=false;save();render()}await persistPreferences()}
function settings(){return `<main class="page"><h1>Settings</h1><section class="card"><div style="display:flex;align-items:center;gap:12px">${avatar(s.profile.name,s.profile.avatar)}<div><strong>${esc(s.profile.name||'Your profile')}</strong><div class="muted">${esc(s.profile.email||'')}</div></div></div><button class="btn secondary" style="width:100%;margin-top:12px" onclick="profile()">Edit profile</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="signOut()">Sign out</button></section><section class="card"><strong>Appearance</strong><div class="row" style="margin-top:12px"><span>Use dark appearance</span><button class="toggle ${s.theme==='dark'?'on':''}" onclick="setThemeMode()"><i></i></button></div><div class="field" style="margin-top:14px"><label>Personal style</label><select onchange="setVisualMode(this.value)"><option value="classic" ${s.profile.visualMode!=='girl'?'selected':''}>Classic — your current look</option><option value="girl" ${s.profile.visualMode==='girl'?'selected':''}>Soft rose — her style</option></select></div></section><section class="card"><strong>Notifications</strong><div class="row" style="margin-top:12px"><span>Allow reminders</span><button class="toggle ${s.settings.notifications?'on':''}" onclick="setNotifications()"><i></i></button></div></section><section class="card"><strong>Special days & holidays</strong><div class="muted">Eid, birthdays, anniversaries and dates worth remembering.</div><button class="btn secondary" style="margin-top:10px;width:100%" onclick="addSpecialDay()">+ Add special day</button></section><section class="card"><strong>Connection</strong><div class="muted">${s.connected&&s.partner?'Connected with '+esc(s.partner.name):'No partner connected yet.'}</div><button class="btn secondary" style="margin-top:10px" onclick="connectSheet()">${s.connected?'Manage connection':'Connect with Her'}</button></section><section class="card"><strong>Privacy & Data</strong><div class="stack" style="margin-top:12px"><button class="btn secondary" onclick="exportData()">Export My Data</button>${s.demo?'<button class="btn danger" onclick="startDemo()">Reset Demo Data</button>':''}</div></section><section class="card"><strong>Help</strong><div class="muted">Replay the guided tour and learn every area of to you.</div><button class="btn ghost" style="margin-top:10px" onclick="s.tour=false;save();render()">Replay tour</button></section></main>`}
function nav(){return `<nav class="nav">${[['home','⌂','Home'],['grow','◎','Goals'],['deen','☪','Deen'],['us','♡','Us']].map(([id,i,l])=>`<button class="${s.screen===id?'active':''}" onclick="go('${id}')"><div>${i}</div>${l}</button>`).join('')}</nav>`}
function render(){document.body.classList.toggle('dark',s.theme==='dark');document.body.classList.toggle('girl-theme',s.profile.visualMode==='girl');document.getElementById('app').innerHTML=(!s.auth&&!s.demo)?authPage():(!s.tour?onboarding():header()+page()+nav())}
function page(){switch(s.screen){case'progress':return progress();case'deen':return deen();case'us':return us();case'quranTogether':return quranTogether();case'grow':return grow();case'ourg':return ourg();case'courses':return courses();case'deenTogether':return deenTogether();case'future':return future();case'journey':return journeyPage();case'notes':return notes();case'search':return searchPage();case'settings':return settings();default:return home()}}
render();
setTimeout(function(){var x=document.getElementById('splash');if(x)x.classList.add('hide')},650);
initAuth();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
