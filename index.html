function switchUserStorage(uid){
  if(!uid){KEY=BASE_KEY;return load()}

const LOVE_REMINDERS_HIM=["Remember why you love her: not only for the good moments, but for the person she is.","She is a real person, not a perfect idea. Love her whole humanity.","Learn her heart with patience. Understanding her matters more than winning an argument.","Do not assume what she feels; leave room for her own words, feelings, and perspective.","Her differences are something to understand, not something to fix.","Sometimes love sounds like reassurance. Sometimes it sounds like patience. Learn the difference.","Pay attention to the little things she values. Small details can become big memories.","Tell her what you appreciate about her while you still have the chance to say it.","Love is not only saying 'I love you'; let your choices make those words believable.","When you misunderstand each other, choose curiosity before conclusions.","Do not turn one difficult moment into a story about the whole relationship.","She can have a different way of showing love and still love deeply.","Give her space to be herself without making her prove her love every day.","Remember that being strong does not mean hiding tenderness.","Protect her dignity, even when you are frustrated.","Apologizing can protect love more than trying to prove you were right.","Be honest without being harsh. Truth and gentleness can live together.","Do not compare her to anyone else. Learn to appreciate the person in front of you.","Your love should make you more responsible, more patient, and more sincere.","Keep building yourself. Loving her does not mean abandoning your own purpose.","She does not need a perfect version of you; keep becoming a better, more trustworthy one.","Remember the girl behind the screen, the plans, and the memories: she has her own heart, fears, hopes, and dreams.","Be interested in understanding what makes her feel respected and appreciated.","Let your actions say: I see you, I respect you, and I care about you.","When she succeeds, celebrate her without making it about yourself.","When she struggles, do not rush to fix everything. Sometimes care begins with simply understanding.","Protect the future you hope to build by making today's character worth trusting.","Love her with patience while both of you grow separately.","Keep your intentions clean and ask Allah to guide your love toward what is good and halal.","One day you may look back at these years. Make sure your love was a source of goodness, not distraction.","Remember: you chose to love her. Keep choosing kindness, patience, honesty, and growth.","I love her. I do not need to prove it with constant words; I can live it through respect.","She matters to me. My job is not to control her feelings; it is to treat her heart with care.","Today, remember one reason she is special to you and let that gratitude change how you act.","Love is not about never misunderstanding each other. It is about caring enough to understand again.","Let her feel that your love has a direction: toward growth, deen, and a future built the right way."];const LOVE_REMINDERS_HER=["Remember why you love him: not only for the best moments, but for the person he is becoming.","He is a real person, not a perfect idea. Love him with room for growth.","Learn his heart with patience. Understanding him matters more than winning an argument.","Do not assume what he feels; leave room for his own words, feelings, and perspective.","His differences are something to understand, not something to fix.","Sometimes love sounds like reassurance. Sometimes it sounds like patience. Learn the difference.","Notice the little things he does well. Appreciation makes ordinary effort feel seen.","Tell him what you genuinely value about him. Do not make him guess everything you feel.","Love is not only saying 'I love you'; let your choices make those words believable.","When you misunderstand each other, choose curiosity before conclusions.","Do not turn one difficult moment into a story about the whole relationship.","He function startQuranLiveSync(coupleId){
  if(quranPollTimer){clearInterval(quranPollTimer);quranPollTimer=null}
  if(quranChannel&&sb){sb.removeChannel(quranChannel);quranChannel=null}
  quranLastPartnerProgressKey='';
  if(!sb||!s.auth||!coupleId||!s.partner?.id)return;

  const applyRows=(rows,notifyPartner=false)=>{
    const incoming=rows||[];
    const next=[...(s.quranUsProgress||[])];
    // Merge server rows into the current state. A temporary empty/partial Realtime
    // response must never erase a completion that is already known locally.
    incoming.forEach(row=>{
      const i=next.findIndex(x=>x.user_id===row.user_id&&x.quran_date===row.quran_date);
      if(i>=0)next[i]=row;else next.push(row);
    });
    const partnerRows=next.filter(x=>x.user_id===s.partner?.id&&x.quran_date===todayKey());
    const key=JSON.stringify(partnerRows.map(x=>[x.user_id,x.pages_completed,x.updated_at]));
    const changed=quranLastPartnerProgressKey!==''&&key!==quranLastPartnerProgressKey;
    quranLastPartnerProgressKey=key;
    s.quranUsProgress=next.filter(x=>x.quran_date===todayKey());
    if(notifyPartner&&changed){
      const p=partnerRows[0];
      s.notifications.unshift({id:'quran-'+Date.now(),text:(s.partner?.name||'Her')+' updated Qur’an muraaja’ah.',date:new Date().toISOString(),status:'received'});
      showQuranPartnerNotification((s.partner?.name||'She')+(p?.pages_completed===3?' completed today’s 3-page muraaja’ah.':' updated today’s Qur’an progress.'));
    }
    save();
    if(s.screen==='quranTogether')render();
  };

  quranChannel=sb.channel('to-you-quran-'+coupleId)
    .on('postgres_changes',{event:'*',schema:'public',table:'quran_muraajaah_progress',filter:'couple_id=eq.'+coupleId},payload=>{
      const row=payload.new||payload.old;
      if(!row)return;
      if(row.quran_date!==todayKey())return;
      sb.from('quran_muraajaah_progress').select('*').eq('couple_id',coupleId).eq('quran_date',todayKey()).then(r=>{
        if(!r.error)applyRows(r.data||[],row.user_id===s.partner?.id);
      });
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'quran_ayah_notes',filter:'couple_id=eq.'+coupleId},payload=>{
      sb.from('quran_ayah_notes').select('*').eq('couple_id',coupleId).order('created_at',{ascending:false}).limit(20).then(r=>{
        if(!r.error){s.quranUsAyahs=r.data||[];save();if(s.screen==='quranTogether')render()}
      });
    })
    .subscribe();

  const poll=async()=>{
    const date=todayKey();
    const r=await sb.from('quran_muraajaah_progress').select('*').eq('couple_id',coupleId).eq('quran_date',date);
    if(r.error)return;
    const rows=r.data||[];
    const partnerRows=rows.filter(x=>x.user_id===s.partner?.id);
    const key=JSON.stringify(partnerRows.map(x=>[x.user_id,x.pages_completed,x.updated_at]));
    const changed=quranLastPartnerProgressKey!==''&&key!==quranLastPartnerProgressKey;
    applyRows(rows,changed);
  };
  poll();
  quranPollTimer=setInterval(poll,5000);
}

    visual_mode:s.profile.visualMode||'classic',

    notifications:!!s.settings.notifications,
    updated_at:new Date().toISOString()
  }).eq('id',s.profile.id);
  if(error)toast('Settings could not sync: '+error.message);
}
async function setThemeMode(){s.theme=s.theme==='dark'?'light':'dark';save();render();await persistPreferences()}
async function setVisualMode(mode){s.profile.visualMode=mode==='girl'?'girl':mode==='ocean'?'ocean':'classic';save();render();await persistPreferences()}
async function setNotifications(){if(!s.settings.notifications){const ok=await enableNotifications();if(!ok)return}else{s.settings.notifications=false;save();render()}await persistPreferences()}
function settings(){return `<main class="page"><h1>Settings</h1><section class="card"><div style="display:flex;align-items:center;gap:12px">${avatar(s.profile.name,s.profile.avatar)}<div><strong>${esc(s.profile.name||'Your profile')}</strong><div class="muted">${esc(s.profile.email||'')}</div></div></div><button class="btn secondary" style="width:100%;margin-top:12px" onclick="profile()">Edit profile</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="signOut()">Sign out</button></section><section class="card"><strong>Appearance</strong><div class="row" style="margin-top:12px"><span>Use dark appearance</span><button class="toggle ${s.theme==='dark'?'on':''}" onclick="setThemeMode()"><i></i></button></div><div class="field" style="margin-top:14px"><label>Personal style</label><select onchange="setVisualMode(this.value)"><option value="classic" ${s.profile.visualMode!=='girl'?'selected':''}>Classic — your current look</option><option value="girl" ${s.profile.visualMode==='girl'?'selected':''}>Soft rose — her style</option><option value="ocean" ${s.profile.visualMode==='ocean'?'selected':''}>Ocean blue — your new style</option></select></div></section><section class="card"><strong>Notifications</strong><div class="row" style="margin-top:12px"><span>Allow reminders</span><button class="toggle ${s.settings.notifications?'on':''}" onclick="setNotifications()"><i></i></button></div></section><section class="card"><strong>Special days & holidays</strong><div class="muted">Eid, birthdays, anniversaries and dates worth remembering.</div><button class="btn secondary" style="margin-top:10px;width:100%" onclick="addSpecialDay()">+ Add special day</button></section><section class="card"><strong>Connection</strong><div class="muted">${s.connected&&s.partner?'Connected with '+esc(s.partner.name):'No partner connected yet.'}</div><button class="btn secondary" style="margin-top:10px" onclick="connectSheet()">${s.connected?'Manage connection':'Connect with Her'}</button></section><section class="card"><strong>Privacy & Data</strong><div class="stack" style="margin-top:12px"><button class="btn secondary" onclick="exportData()">Export My Data</button>${s.demo?'<button class="btn danger" onclick="startDemo()">Reset Demo Data</button>':''}</div></section><section class="card"><strong>Help</strong><div class="muted">Replay the guided tour and learn every area of أمانة.</div><button class="btn ghost" style="margin-top:10px" onclick="s.tour=false;save();render()">Replay tour</button></section></main>`}
function nav(){return `<nav class="nav">${[['home','⌂','Home'],['progress','◔','Progress'],['deen','☪','Deen'],['us','♡','Us']].map(([id,i,l])=>`<button class="${s.screen===id?'active':''}" onclick="go('${id}')"><div>${i}</div>${l}</button>`).join('')}</nav>`}
function render(){document.body.classList.toggle('dark',s.theme==='dark');document.body.classList.toggle('girl-theme',s.profile.visualMode==='girl');document.body.classList.toggle('ocean-theme',s.profile.visualMode==='ocean');const app=document.getElementById('app');if(!authReady){app.innerHTML='<main class="authPage"><div class="authLogo">أمانة</div><p class="authTag">Restoring your session…</p></main>';return}app.innerHTML=(!s.auth&&!s.demo)?authPage():(!s.tour?onboarding():header()+page()+nav())}
function page(){switch(s.screen){case'progress':return progress();case'deen':return deen();case'us':return us();case'quranTogether':return quranTogether();case'grow':return grow();case'ourg':return ourg();case'courses':return courses();case'deenTogether':return deenTogether();case'hadithTogether':return hadithTogetherPage();case'future':return future();case'journey':return journeyPage();case'notes':return notes();case'search':return searchPage();case'settings':return settings();default:return home()}}
window.addEventListener('online',function(){if(s.auth)render()});
window.addEventListener('offline',function(){if(s.auth)render()});
render();
setTimeout(function(){var x=document.getElementById('splash');if(x)x.classList.add('hide')},650);
initAuth();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
