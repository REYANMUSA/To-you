<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f4"><meta name="description" content="to you — becoming better, one day at a time."><title>to you</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<style>
:root{--bg:#f7f7f4;--card:#fff;--text:#20231f;--muted:#737870;--line:#e4e6e1;--accent:#718c73;--accent2:#4f6852;--soft:#e8eee8;--danger:#a75d5d;--shadow:0 8px 30px rgba(32,35,31,.06);--radius:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:92px}.top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;position:sticky;top:0;background:rgba(247,247,244,.95);backdrop-filter:blur(10px);z-index:4}.brand{font-size:21px;font-weight:750;letter-spacing:-.5px}.page{padding:12px 18px}.greeting{font-size:29px;font-weight:780;letter-spacing:-1px;margin:8px 0 3px}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;margin:12px 0;box-shadow:var(--shadow)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:10px}.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent2);border-radius:99px;padding:6px 10px;font-size:12px;font-weight:700}.btn{padding:12px 15px;border-radius:13px;background:var(--accent);color:#fff;font-weight:700}.btn.secondary{background:var(--soft);color:var(--accent2)}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.danger{background:#f7e9e9;color:#8e4f4f}.btn:disabled{opacity:.55;cursor:not-allowed}.calendarGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.calDay{min-height:48px;border:1px solid var(--line);border-radius:13px;background:var(--card);padding:7px;text-align:center}.calDay.today{outline:2px solid var(--accent);outline-offset:-2px}.calDay .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin:5px auto 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card)}.item.done{opacity:.58}.check{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff}.check.done{background:var(--accent);color:#fff}.progress{height:9px;background:#edf0eb;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{background:transparent;color:var(--muted);padding:7px 2px;border-radius:12px;font-size:12px}.nav button.active{background:var(--soft);color:var(--accent2);font-weight:700}.hidden{display:none!important}.center{text-align:center}.big{font-size:40px;font-weight:800}.small{font-size:12px}.icon{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:14px}.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--line);display:grid;place-items:center}.avatar.fallback{background:var(--soft);color:var(--accent2);font-weight:800}.profileMini{background:transparent;padding:0;border-radius:50%}.profileMini .avatar{width:38px;height:38px}.people{display:flex;align-items:center;justify-content:center;gap:14px;text-align:center}.person{display:grid;justify-items:center;gap:4px;min-width:90px}.connectionLine{font-size:22px;color:var(--accent)}.field{display:grid;gap:6px;margin:10px 0}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;outline:none;background:var(--bg);color:var(--text)}.field textarea{min-height:100px;resize:vertical}.modal{position:fixed;inset:0;background:rgba(20,22,20,.3);display:flex;align-items:flex-end;justify-content:center;z-index:20}.sheet{width:min(560px,100%);background:#fff;border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow:auto}.googleBtn{width:100%;padding:13px;border:1px solid #dadce0;background:#fff;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:650;margin-top:20px}.googleMark{font-weight:800;font-size:19px}.or{display:flex;align-items:center;gap:10px;color:var(--muted);margin:16px 0}.or:before,.or:after{content:'';height:1px;background:var(--line);flex:1}.tiny{font-size:12px;margin-top:14px}.empty{padding:25px 8px;text-align:center;color:var(--muted)}.sectionTitle{margin:24px 0 8px}.back{display:flex;align-items:center;gap:8px;background:transparent;padding:5px 0;color:var(--muted)}.listBtn{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.toggle{width:48px;height:28px;border-radius:99px;background:#dfe3dd;padding:3px}.toggle i{display:block;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.toggle.on{background:var(--accent)}.toggle.on i{transform:translateX(20px)}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#20231f;color:#fff;padding:10px 14px;border-radius:12px;z-index:30;box-shadow:var(--shadow)}.girl-theme{--bg:#fff8fa;--card:#fff;--text:#2b2528;--muted:#85757b;--line:#eadfe3;--accent:#c9859d;--accent2:#925d73;--soft:#f8e9ef;--shadow:0 8px 30px rgba(95,55,70,.07)}
.girl-theme .btn{background:var(--accent)}.girl-theme .btn.secondary{background:var(--soft);color:var(--accent2)}.girl-theme .nav button.active{background:var(--soft);color:var(--accent2)}
.check.done{position:relative;display:grid;place-items:center;border-color:var(--accent);animation:checkPop .28s ease-out}.check.done::after{content:'✓';font-weight:900;font-size:18px;line-height:1;animation:checkDraw .35s ease-out}.check.done{font-size:0}
@keyframes checkPop{0%{transform:scale(.72);opacity:.6}65%{transform:scale(1.12)}100%{transform:scale(1)}}@keyframes checkDraw{0%{transform:scale(.2) rotate(-18deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.streakBadge{display:inline-flex;align-items:center;gap:5px}.streakFire{display:inline-block;transform-origin:center bottom}.streakFire.active{animation:streakBounce .55s ease-out}@keyframes streakBounce{0%{transform:scale(.7) translateY(4px)}45%{transform:scale(1.25) translateY(-2px)}100%{transform:scale(1) translateY(0)}}
.journeyPhoto{width:100%;max-height:260px;object-fit:cover;border-radius:16px;margin-top:12px;border:1px solid var(--line)}
.photoPreview{width:100%;max-height:180px;object-fit:cover;border-radius:14px;margin-top:8px;border:1px solid var(--line)}
@media(min-width:700px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

body.dark{--bg:#171a17;--card:#20241f;--text:#f1f3ef;--muted:#aab1a9;--line:#343a34;--soft:#29332b;--shadow:0 8px 30px rgba(0,0,0,.18)}body.dark .top{background:rgba(23,26,23,.95)}body.dark .nav{background:rgba(32,36,31,.97)}body.dark .icon,body.dark .listBtn,body.dark .googleBtn{background:#20241f;color:var(--text);border-color:var(--line)}body.dark .field input,body.dark .field textarea,body.dark .field select{background:#171a17;color:var(--text)}.authPage{min-height:100vh;display:grid;align-content:center;padding:28px 18px}.authLogo{text-align:center;font-size:38px;font-weight:800;letter-spacing:-1.8px}.authTag{text-align:center;color:var(--muted);margin:5px 0 26px}.authCard{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}.authSwitch{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);padding:4px;border-radius:14px;margin-bottom:8px}.authSwitch button{background:transparent;padding:10px;border-radius:11px;color:var(--muted)}.authSwitch button.active{background:var(--card);color:var(--text);font-weight:750;box-shadow:0 2px 8px rgba(0,0,0,.05)}
</style><script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><div id="app" class="app"></div>
<script>
const KEY='toyou_phase5_v1';
const SUPABASE_URL=window.TOYOU_SUPABASE_URL||'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY=window.TOYOU_SUPABASE_ANON_KEY||'YOUR_SUPABASE_ANON_KEY';
const REAL_AUTH=typeof supabase!=='undefined' && !SUPABASE_URL.startsWith('YOUR_') && !SUPABASE_ANON_KEY.startsWith('YOUR_');
let sb=REAL_AUTH?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const fresh={profile:{id:'',name:'',email:'',avatar:'',provider:'',accent:'#718c73',visualMode:'classic'},partner:null,screen:'home',theme:'light',tour:false,auth:false,demo:false,signup:false,connected:false,connectionCode:'',habits:[],habitCompletions:{},tasks:[],taskCompletions:{},goals:[],sharedGoals:[],dhikr:0,dhikrDate:'',prayer:{Fajr:true,Dhuhr:true,Asr:true,Maghrib:true,Isha:true},hadithLearned:[],quran:{goal:'',progress:0},courses:[],journey:[],future:[],notes:[],reflections:[],achievements:[],needSent:false,notifications:[],search:'',settings:{notifications:true,dark:false}};
const demoSeed={habits:[{id:'h1',name:'Study for 30 minutes',frequency:'Daily'},{id:'h2',name:'Exercise',frequency:'Daily'},{id:'h3',name:'Read',frequency:'Daily'}],tasks:[{id:'t1',title:"Finish today's work",date:new Date().toISOString().slice(0,10)},{id:'t2',title:'Review notes',date:new Date().toISOString().slice(0,10)}],goals:[{id:'g1',title:'Become a better version of myself',progress:42,target:'2027-01-01'},{id:'g2',title:'Build something real',progress:25,target:'2026-12-31'}],quran:{goal:'Read 10 pages a day',progress:4},courses:[{id:'c1',owner:'me',name:'Web Development',progress:35,status:'In progress'}],journey:[{id:'j1',date:'2024-01-01',title:'The day we met',type:'past',desc:'A meaningful beginning.',photo:''}],future:[{id:'f1',title:'Education',desc:'Keep building knowledge.'},{id:'f2',title:'Career',desc:'Become capable of creating real things.'}],dhikr:37,hadithLearned:[1],achievements:['demo'],partner:{name:'Demo Her',email:'her@demo.toyou.app',avatar:'',provider:'demo'},connected:true};
let s=load();
function clone(x){return JSON.parse(JSON.stringify(x))} function load(){try{return Object.assign(clone(fresh),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return clone(fresh)}} function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function initials(n){return esc((n||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase())} function avatar(n,url=''){return url?`<img class="avatar" src="${esc(url)}" alt="">`:`<div class="avatar fallback">${initials(n)}</div>`}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function todayKey(){return new Date().toISOString().slice(0,10)}
function doneOn(type,id,date=todayKey()){let bag=type==='habit'?s.habitCompletions:s.taskCompletions;return !!(bag[id]&&bag[id][date])}
function setDone(type,id,done,date=todayKey()){let bag=type==='habit'?s.habitCompletions:s.taskCompletions;bag[id]=bag[id]||{};if(done)bag[id][date]=true;else delete bag[id][date];save()}
function streakFor(id){let bag=s.habitCompletions[id]||{},n=0,d=new Date();for(let i=0;i<366;i++){let k=new Date(d);k.setDate(d.getDate()-i);let key=k.toISOString().slice(0,10);if(bag[key])n++;else break}return n}
function go(screen){s.screen=screen;save();render()}
function pct(){let all=s.habits.length+s.tasks.length,done=s.habits.filter(x=>doneOn('habit',x.id)).length+s.tasks.filter(x=>doneOn('task',x.id)).length;return all?Math.round(done/all*100):0}
function openSheet(html){document.body.insertAdjacentHTML('beforeend',html)} function closeSheet(){document.querySelector('.modal')?.remove()}
function modal(title,body){return `<div class="modal" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="row"><h2 style="margin:0">${title}</h2><button class="icon" onclick="closeSheet()">×</button></div>${body}</div></div>`}
function profile(){openSheet(modal('Your profile',`<div class="profileRow" style="display:flex;gap:12px;align-items:center;margin:18px 0">${avatar(s.profile.name,s.profile.avatar)}<div><strong>${esc(s.profile.name||'Your profile')}</strong><div class="muted">${esc(s.profile.email)}</div></div></div><div class="field"><label>Name</label><input id="pname" value="${esc(s.profile.name||'')}" placeholder="Your name"></div><div class="field"><label>Profile photo URL <span class="muted">(optional)</span></label><input id="pavatar" value="${esc(s.profile.avatar||'')}" placeholder="https://..."></div><button class="btn" style="width:100%" onclick="saveProfile()">Save profile</button>`))}
async function saveProfile(){let n=document.getElementById('pname').value.trim();if(!n)return toast('Enter your name');s.profile.name=n;s.profile.avatar=document.getElementById('pavatar').value.trim();save();if(sb&&s.auth){let {error}=await sb.from('profiles').upsert({id:s.profile.id,display_name:n,avatar_url:s.profile.avatar||null,visual_mode:s.profile.visualMode||'classic',updated_at:new Date().toISOString()});if(error)return toast(error.message)}closeSheet();render();toast('Profile saved')}
function authPage(){return `<main class="authPage"><div class="authLogo">to you</div><p class="authTag">Becoming better, one day at a time.</p><section class="authCard"><div class="authSwitch"><button class="${!s.signup?'active':''}" onclick="s.signup=false;render()">Log in</button><button class="${s.signup?'active':''}" onclick="s.signup=true;render()">Create account</button></div><button class="googleBtn" onclick="googleLogin()"><span class="googleMark">G</span> Continue with Google</button><div class="or"><span>or</span></div><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••"></div><button class="btn" style="width:100%" onclick="emailAuth()">${s.signup?'Create account':'Log in'}</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="startDemo()">Try Demo</button><p class="muted tiny center">Your private data stays private. Demo data is separate from real accounts.</p></section></main>`}
function startDemo(){s=clone(fresh);Object.assign(s,clone(demoSeed));s.demo=true;s.auth=false;s.profile={name:'Demo Me',email:'demo@toyou.app',avatar:'',provider:'demo',accent:'#718c73'};s.tour=true;save();render();toast('Demo mode started')}
async function googleLogin(){if(!sb)return toast('Add Supabase URL + anon key first');const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)toast(error.message)}
async function emailAuth(){let e=document.getElementById('loginEmail').value.trim(),p=document.getElementById('loginPass').value;if(!e||p.length<6)return toast('Use a valid email and 6+ character password');if(!sb)return toast('Add Supabase URL + anon key first');let r=s.signup?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});if(r.error)return toast(r.error.message);if(s.signup&&r.data.user&&!r.data.session)return toast('Check your email to confirm your account')}
async function signOut(){if(sb)await sb.auth.signOut();localStorage.removeItem(KEY);s=clone(fresh);render()}
async function initAuth(){if(!sb){render();return}let {data}=await sb.auth.getSession();if(data.session)await hydrateUser(data.session.user);else render();sb.auth.onAuthStateChange(async(_event,session)=>{if(session)await hydrateUser(session.user);else if(!s.demo){s=clone(fresh);render()}})}
async function cloudUpsert(table,row){if(!sb||!s.auth)return;const r=await sb.from(table).upsert(row);if(r.error)toast(r.error.message);return r.error}
async function cloudDelete(table,id){if(!sb||!s.auth)return;const r=await sb.from(table).delete().eq('id',id);if(r.error)toast(r.error.message);return r.error}
async function hydrateCoreData(){if(!sb||!s.auth)return;const uid=s.profile.id;const [h,t,g,j,hc,tc]=await Promise.all([sb.from('habits').select('*').eq('owner_user_id',uid).eq('archived',false),sb.from('tasks').select('*').eq('owner_user_id',uid).eq('archived',false),sb.from('goals').select('*').eq('owner_user_id',uid).neq('status','ARCHIVED'),sb.from('journey_events').select('*').eq('owner_user_id',uid).order('event_date',{ascending:true}),sb.from('habit_completions').select('habit_id,completed_on').eq('owner_user_id',uid),sb.from('task_completions').select('task_id,completed_on').eq('owner_user_id',uid)]);if(!h.error)s.habits=(h.data||[]).map(x=>({id:x.id,name:x.name,frequency:x.frequency}));if(!t.error)s.tasks=(t.data||[]).map(x=>({id:x.id,title:x.title,date:x.due_date||'Today'}));if(!g.error)s.goals=(g.data||[]).map(x=>({id:x.id,title:x.title,progress:x.progress,target:x.target_date||'',desc:x.description||''}));if(!j.error)s.journey=(j.data||[]).map(x=>({id:x.id,title:x.title,date:x.event_date,type:x.time_position,desc:x.description||'',photo:''}));s.habitCompletions={};(hc.data||[]).forEach(x=>(s.habitCompletions[x.habit_id]??={})[x.completed_on]=true);s.taskCompletions={};(tc.data||[]).forEach(x=>(s.taskCompletions[x.task_id]??={})[x.completed_on]=true);save();render()}
async function hydrateUser(user){let {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error)return toast(error.message);if(!p){let name=user.user_metadata?.full_name||user.email?.split('@')[0]||'New user';let ins=await sb.from('profiles').insert({id:user.id,display_name:name,avatar_url:user.user_metadata?.avatar_url||null});if(ins.error)return toast(ins.error.message);p={id:user.id,display_name:name,avatar_url:user.user_metadata?.avatar_url||null}}s.profile={id:p.id,name:p.display_name||'Your profile',email:user.email||'',avatar:p.avatar_url||'',provider:'google/email',visualMode:p.visual_mode||'classic'};s.auth=true;s.demo=false;s.tour=true;save();render();await hydrateCoreData()}
function connectSheet(){openSheet(modal('Connect with Her',`<p class="muted">Connect only when both of you intentionally choose to. Private data stays private.</p><div class="field"><label>Her connection code</label><input id="connectCode" placeholder="TOYOU-7K4P-92" autocapitalize="characters"></div><button class="btn" style="width:100%" onclick="redeemCode()">Connect</button><div class="or"><span>or</span></div><button class="btn secondary" style="width:100%" onclick="createCode()">Create my code</button><div id="codeBox" class="empty"></div>`))}
async function createCode(){if(!sb||!s.auth)return toast('Real account required');let {data,error}=await sb.rpc('create_connection_code');if(error)return toast(error.message);document.getElementById('codeBox').innerHTML=`<strong>Your code</strong><div class="big" style="font-size:25px;margin-top:8px">${esc(data)}</div><div class="muted">Give this code to the person you want to connect with.</div>`}
async function redeemCode(){let code=document.getElementById('connectCode').value.trim().toUpperCase();if(!code)return toast('Enter a code');if(!sb||!s.auth)return toast('Real account required');let {data,error}=await sb.rpc('redeem_connection_code',{p_code:code});if(error)return toast(error.message);closeSheet();await refreshPartner();toast('Connected safely')}
async function refreshPartner(){
  let {data,error}=await sb.rpc('get_my_connection');

  if(error||!data||!data.length){
    s.partner=null;
    s.connected=false;
  }else{
    let p=data[0];
    s.partner={
      id:p.partner_id,
      name:p.partner_name||'Her',
      avatar:p.partner_avatar||'',
      email:'',
      provider:''
    };
    s.connected=true;
  }

  save();
  render();
}
async function toggleItem(type,id){let kind=type==='habits'?'habit':'task';let done=!doneOn(kind,id);setDone(kind,id,done);if(sb&&s.auth){const table=kind==='habit'?'habit_completions':'task_completions';const key=kind==='habit'?'habit_id':'task_id';if(done)await cloudUpsert(table,{[key]:id,owner_user_id:s.profile.id,completed_on:todayKey()});else await sb.from(table).delete().eq(key,id).eq('owner_user_id',s.profile.id).eq('completed_on',todayKey())}if(done&&kind==='habit')toast('Habit completed ✓');render()}
function addHabit(){openSheet(modal('Create habit',`<div class="field"><label>Habit name</label><input id="newHabit" placeholder="e.g. Study for 30 minutes"></div><div class="field"><label>Frequency</label><select id="habitFreq"><option>Daily</option><option>Weekdays</option><option>Selected days</option></select></div><button class="btn" style="width:100%" onclick="createHabit()">Create habit</button>`))}
async function createHabit(){let n=document.getElementById('newHabit').value.trim();if(!n)return;let id=crypto.randomUUID(),frequency=document.getElementById('habitFreq').value;s.habits.push({id,name:n,frequency});if(sb&&s.auth)await cloudUpsert('habits',{id,owner_user_id:s.profile.id,name:n,frequency});save();closeSheet();render();toast('Habit created')}
function addTask(){openSheet(modal('Create task',`<div class="field"><label>Task</label><input id="newTask" placeholder="What needs to be done?"></div><div class="field"><label>Date</label><input id="taskDate" type="date"></div><button class="btn" style="width:100%" onclick="createTask()">Create task</button>`))}
async function createTask(){let n=document.getElementById('newTask').value.trim();if(!n)return;let id=crypto.randomUUID(),date=document.getElementById('taskDate').value||'';s.tasks.push({id,title:n,date:date||'Today'});if(sb&&s.auth)await cloudUpsert('tasks',{id,owner_user_id:s.profile.id,title:n,due_date:date||null});save();closeSheet();render();toast('Task created')}
function addGoal(){openSheet(modal('Create goal',`<div class="field"><label>Goal</label><input id="newGoal" placeholder="What are you building toward?"><div class="grid3" style="margin-top:8px"><button class="btn ghost" type="button" onclick="newGoal.value='Build a skill'">Build a skill</button><button class="btn ghost" type="button" onclick="newGoal.value='Improve my Deen'">Improve my Deen</button><button class="btn ghost" type="button" onclick="newGoal.value='Build something real'">Build something real</button></div></div><div class="field"><label>Description</label><textarea id="goalDesc" placeholder="Why does this matter?"></textarea></div><div class="field"><label>Target date</label><input id="goalDate" type="date"></div><button class="btn" style="width:100%" onclick="createGoal()">Create goal</button>`))}
async function createGoal(){let n=document.getElementById('newGoal').value.trim();if(!n)return;let id=crypto.randomUUID(),target=document.getElementById('goalDate').value||'',desc=document.getElementById('goalDesc').value.trim();s.goals.push({id,title:n,progress:0,target,desc});if(sb&&s.auth)await cloudUpsert('goals',{id,owner_user_id:s.profile.id,title:n,description:desc,progress:0,target_date:target||null});save();closeSheet();render();toast('Goal created')}
function editGoal(id){let g=s.goals.find(x=>x.id===id);if(!g)return;openSheet(modal('Update goal',`<div class="field"><label>Progress: <span id="gpv">${g.progress}</span>%</label><input id="gprogress" type="range" min="0" max="100" value="${g.progress}" oninput="gpv.textContent=this.value"></div><button class="btn" style="width:100%" onclick="g.progress=+gprogress.value;if(sb&&s.auth)cloudUpsert('goals',{id:g.id,owner_user_id:s.profile.id,title:g.title,description:g.desc||'',progress:g.progress,target_date:g.target||null});save();closeSheet();render()">Save progress</button><button class="btn danger" style="width:100%;margin-top:8px" onclick="if(confirm('Delete this goal?')){s.goals=s.goals.filter(x=>x.id!=='${id}');if(sb&&s.auth)cloudDelete('goals','${id}');save();closeSheet();render();toast('Goal deleted')}">Delete goal</button>`))}
function prayer(){openSheet(modal('Prayer reminders',`<p class="muted">Reminders only — prayers are not task checkboxes.</p><div class="stack">${Object.keys(s.prayer).map(k=>`<div class="item row"><div><strong>${k}</strong><div class="muted">Reminder ${s.prayer[k]?'on':'off'}</div></div><button class="toggle ${s.prayer[k]?'on':''}" onclick="s.prayer['${k}']=!s.prayer['${k}'];save();render();closeSheet();prayer()"><i></i></button></div>`).join('')}</div>`))}
function dhikr(){openSheet(modal('Astaghfirullah',`<div class="center"><div class="big">${s.dhikr}</div><div class="muted">of 100 today</div><div style="margin:18px 0" class="progress"><i style="width:${s.dhikr}%"></i></div><button class="btn" style="width:100%;font-size:18px" onclick="s.dhikr=Math.min(100,s.dhikr+1);save();render();closeSheet();dhikr()">+1</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="s.dhikr=0;save();render();closeSheet();dhikr()">Reset</button></div>`))}
function hadith(){openSheet(modal('Today’s Hadith',`<span class="pill">Day 1 · Sahih al-Bukhari</span><h2>إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ</h2><p><em>Innamal-a‘mālu bin-niyyāt</em></p><p>“Actions are judged by intentions.”</p><p class="muted">Reference: Sahih al-Bukhari 1. Production version must use the verified Bukhari/Muslim library only.</p><div class="grid2"><button class="btn secondary" onclick="toast('Practice mode')">Practice</button><button class="btn" onclick="s.hadithLearned=[...new Set([...s.hadithLearned,1])];save();closeSheet();render();toast('Marked learned')">Mark learned</button></div>`))}
function challenge(){openSheet(modal('Deen Challenge',`<span class="pill">Scenario · Based on learned material</span><h3>A person gives charity sincerely for Allah, while another does it only so people praise him. What is the key difference?</h3><div class="stack">${['The amount of charity','The intention behind the action','Who received the charity','When it was given'].map((x,i)=>`<button class="listBtn" onclick="challengeAnswer(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div>`))}
function challengeAnswer(i){closeSheet();openSheet(modal('Answer',`<div class="pill">${i===1?'Correct ✓':'Review this one'}</div><p>The key principle is the intention behind an action. This challenge is based on the hadith about intentions.</p><p class="muted">Source: Sahih al-Bukhari 1.</p><button class="btn" style="width:100%" onclick="closeSheet()">Continue</button>`))}
function course(){openSheet(modal('Add course',`<div class="field"><label>Course name</label><input id="courseName" placeholder="Web Development"></div><div class="field"><label>Owner</label><select id="courseOwner"><option value="me">Mine</option><option value="her">Hers</option></select></div><button class="btn" style="width:100%" onclick="let n=courseName.value.trim();if(n){s.courses.push({id:crypto.randomUUID(),owner:courseOwner.value,name:n,progress:0,status:'In progress'});save();closeSheet();render();toast('Course added')}">Add course</button>`))}
function journey(){go('journey')}
let journeyPhotoData='';
async function journeyPhoto(input){const file=input.files&&input.files[0];if(!file)return;try{const bmp=await createImageBitmap(file);const max=1400,scale=Math.min(1,max/bmp.width,max/bmp.height);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*scale));c.height=Math.max(1,Math.round(bmp.height*scale));c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);journeyPhotoData=c.toDataURL('image/jpeg',.78);const p=document.getElementById('journeyPreview');if(p){p.src=journeyPhotoData;p.classList.remove('hidden')}}catch(e){toast('Could not read that photo')}}
async function addJourneyEvent(){let t=document.getElementById('jTitle').value.trim();if(!t)return toast('Add a title');let id=crypto.randomUUID(),date=document.getElementById('jDate').value||todayKey(),type=document.getElementById('jType').value,desc=document.getElementById('jDesc').value.trim(),photo=journeyPhotoData||'';s.journey.push({id,title:t,date,type,desc,photo});if(sb&&s.auth){await cloudUpsert('journey_events',{id,owner_user_id:s.profile.id,title:t,event_date:date,time_position:type,description:desc});if(journeyPhotoData){try{const path=`${s.profile.id}/${id}.jpg`;const blob=await (await fetch(journeyPhotoData)).blob();const up=await sb.storage.from('journey-media').upload(path,blob,{contentType:'image/jpeg',upsert:true});if(!up.error){await cloudUpsert('journey_media',{journey_event_id:id,owner_user_id:s.profile.id,storage_path:path});const signed=await sb.storage.from('journey-media').createSignedUrl(path,60*60*24*30);if(signed.data?.signedUrl){s.journey[s.journey.length-1].photo=signed.data.signedUrl}}}catch(e){}}}journeyPhotoData='';save();closeSheet();render();toast('Journey updated')}
function addJourney(){journeyPhotoData='';openSheet(modal('Add journey event',`<div class="field"><label>What happened?</label><input id="jTitle" placeholder="A meaningful milestone"></div><div class="field"><label>Date</label><input id="jDate" type="date" value="${todayKey()}"></div><div class="field"><label>Time position</label><select id="jType"><option value="past">Past</option><option value="present">Present</option><option value="future">Future</option></select></div><div class="field"><label>Description</label><textarea id="jDesc" placeholder="What do you want to remember?"></textarea></div><div class="field"><label>Photo <span class="muted">(optional)</span></label><input type="file" accept="image/*" onchange="journeyPhoto(this)"><img id="journeyPreview" class="photoPreview hidden" alt="Photo preview"></div><button class="btn" style="width:100%" onclick="addJourneyEvent()">Add event</button>`))}
function need(){s.needSent=true;s.notifications.push({id:crypto.randomUUID(),text:`${s.profile.name} needs you`,date:new Date().toISOString()});save();render();toast('I Need You signal sent')}
function addNote(){openSheet(modal('New note',`<div class="field"><label>Title</label><input id="noteTitle"></div><div class="field"><label>Note</label><textarea id="noteBody"></textarea></div><button class="btn" style="width:100%" onclick="let t=noteTitle.value.trim();if(t){s.notes.unshift({id:crypto.randomUUID(),title:t,body:noteBody.value,date:new Date().toISOString()});save();closeSheet();render();toast('Note saved')}">Save note</button>`))}
function reflect(){openSheet(modal('Daily reflection',`<div class="field"><label>What went well?</label><textarea id="r1"></textarea></div><div class="field"><label>What could improve?</label><textarea id="r2"></textarea></div><div class="field"><label>What are you grateful for?</label><textarea id="r3"></textarea></div><button class="btn" style="width:100%" onclick="s.reflections.unshift({date:new Date().toISOString(),good:r1.value,improve:r2.value,grateful:r3.value});save();closeSheet();toast('Reflection saved')">Save reflection</button>`))}
function search(){s.search=document.getElementById('searchInput')?.value||'';save();render()}

function onboarding(){return `<main class="page"><section class="card center" style="margin-top:20vh"><div class="brand">to you</div><h1>Becoming better, one day at a time.</h1><p class="muted">Your space for growth, Deen, learning, and the future you’re building.</p><button class="btn" style="width:100%" onclick="s.tour=true;save();render()">Get started</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="login()">I already have an account</button></section></main>`}

function home(){let p=pct(),hour=new Date().getHours(),hello=hour<12?'morning':hour<18?'afternoon':'evening';let habits=s.habits.map(function(x){let done=doneOn('habit',x.id);return '<button class="listBtn '+(done?'item done':'')+'" style="margin-top:10px" onclick="toggleItem(\'habits\',\''+x.id+'\')"><div class="row"><div><strong>'+esc(x.name)+'</strong><div class="muted">🔥 '+streakFor(x.id)+' day streak · '+esc(x.frequency||'Daily')+'</div></div><span class="check '+(done?'done':'')+'">'+(done?'✓':'')+'</span></div></button>'}).join('');let tasks=s.tasks.map(function(x){let done=doneOn('task',x.id);return '<button class="listBtn '+(done?'item done':'')+'" style="margin-top:10px" onclick="toggleItem(\'tasks\',\''+x.id+'\')"><div class="row"><div><strong>'+esc(x.title)+'</strong><div class="muted">'+esc(x.date||'Today')+'</div></div><span class="check '+(done?'done':'')+'">'+(done?'✓':'')+'</span></div></button>'}).join('');return '<main class="page"><div class="muted">'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'</div><div class="greeting">Good '+hello+(s.profile.name?', '+esc(s.profile.name):'')+'.</div><div class="muted">Let’s make today count.</div><section class="card"><div class="row"><strong>Today’s progress</strong><span class="pill">'+p+'%</span></div><div style="margin:14px 0" class="progress"><i style="width:'+p+'%"></i></div><div class="muted">'+(s.habits.filter(x=>doneOn('habit',x.id)).length+s.tasks.filter(x=>doneOn('task',x.id)).length)+' completed today</div></section><section class="card"><div class="row"><strong>Today’s habits</strong><button class="btn secondary" onclick="addHabit()">+ Add</button></div>'+(s.habits.length?habits:'<div class="empty">No habits yet. Add the first one.</div>')+'</section><section class="card"><div class="row"><strong>Tasks</strong><button class="btn secondary" onclick="addTask()">+ Add</button></div>'+(s.tasks.length?tasks:'<div class="empty">No tasks yet.</div>')+'</section><section class="card"><div class="row"><strong>Deen</strong><span class="pill">'+s.dhikr+'/100</span></div><div class="muted" style="margin-top:6px">Astaghfirullah · Today’s Hadith</div></section><section class="card"><strong>Us</strong><div class="muted">'+(s.connected&&s.partner?'Connected with '+esc(s.partner.name)+' · Growing separately. Growing together.':'Your shared space is ready when you connect.')+'</div></section></main>'}
function progress(){let now=new Date(),days=[],start=new Date(now.getFullYear(),now.getMonth(),1).getDay(),total=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();for(let i=0;i<start;i++)days.push('<div></div>');for(let d=1;d<=total;d++){let date=new Date(now.getFullYear(),now.getMonth(),d),key=date.toISOString().slice(0,10),active=s.habits.some(h=>doneOn('habit',h.id,key))||s.tasks.some(t=>doneOn('task',t.id,key));days.push('<div class="calDay '+(d===now.getDate()?'today':'')+'"><strong>'+d+'</strong>'+(active?'<div class="dot"></div>':'')+'</div>')}let goals=s.goals.map(function(g){return '<div style="margin-top:14px"><div class="row"><span>'+esc(g.title)+'</span><span>'+g.progress+'%</span></div><div class="progress" style="margin-top:8px"><i style="width:'+g.progress+'%"></i></div></div>'}).join('');return '<main class="page"><h1>Progress</h1><section class="card"><div class="row"><strong>Today</strong><span class="pill">'+pct()+'%</span></div><div class="progress" style="margin-top:12px"><i style="width:'+pct()+'%"></i></div><div class="muted" style="margin-top:8px">Progress comes from what you actually complete.</div></section><section class="card"><h2 style="margin-top:0">'+now.toLocaleString(undefined,{month:'long',year:'numeric'})+'</h2><div class="calendarGrid">'+days.join('')+'</div></section><section class="card"><strong>Goals</strong>'+(goals||'<div class="empty">Create a goal to see it here.</div>')+'</section><section class="card"><strong>Achievements</strong><div class="muted">'+s.achievements.length+' unlocked · No rankings.</div></section></main>'}
function deen(){return `<main class="page"><h1>Deen</h1><section class="card" onclick="prayer()"><div class="row"><div><strong>Prayer reminders</strong><div class="muted">Fajr · Dhuhr · Asr · Maghrib · Isha</div></div><span>⏰</span></div></section><section class="card" onclick="dhikr()"><div class="row"><div><strong>Astaghfirullah</strong><div class="muted">${s.dhikr}/100</div></div><span class="pill">${s.dhikr}%</span></div><div style="margin-top:12px" class="progress"><i style="width:${s.dhikr}%"></i></div></section><section class="card" onclick="hadith()"><span class="pill">Today’s Hadith · Day ${s.hadithLearned.length?1:1}</span><h2>Actions are judged by intentions.</h2><div class="muted">Sahih al-Bukhari 1 · Arabic · transliteration · meaning</div></section><section class="card"><div class="row"><strong>Qur’an goal</strong><span>${s.quran.progress} pages</span></div><div class="muted">${esc(s.quran.goal)}</div></section><section class="card" onclick="challenge()"><strong>Deen Challenge</strong><div class="muted">Islamic scenarios based on what you’ve learned.</div></section></main>`}

ected?'':'disabled')+' onclick="'+(connected?'need()':"toast('Connect first')")+'">'+(connected?(s.need
