<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Waypoint</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      text-align: center;
      padding: 30px;
    }

    .logo {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    p {
      color: #9ca3af;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <main class="app">
    <div class="logo">🧭</div>
    <h1>Waypoint</h1>
    <p>Your day. Your direction.</p>
  </main>

</body>
</html>
