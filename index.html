<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Waypoint</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      padding: 25px 20px 100px;
    }

    header {
      margin-bottom: 30px;
    }

    .date {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 32px;
    }

    .subtitle {
      color: #94a3b8;
      margin-top: 6px;
    }

    .progress-card {
      background: #1e293b;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .progress-number {
      font-size: 28px;
      font-weight: bold;
    }

    .progress-bar {
      height: 10px;
      background: #334155;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #22c55e;
      border-radius: 20px;
      transition: 0.3s;
    }

    .section-title {
      margin-bottom: 14px;
      font-size: 20px;
    }

    .habit {
      background: #1e293b;
      padding: 17px;
      border-radius: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .check {
      width: 25px;
      height: 25px;
      border: 2px solid #64748b;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
    }

    .habit.completed .check {
      background: #22c55e;
      border-color: #22c55e;
    }

    .habit.completed .name {
      text-decoration: line-through;
      color: #64748b;
    }

    .name {
      font-size: 16px;
    }

    .add-button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: #22c55e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      background: #111827;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: space-around;
      padding: 15px 5px;
    }

    .nav-item {
      color: #94a3b8;
      text-align: center;
      font-size: 13px;
      cursor: pointer;
    }

    .nav-item.active {
      color: #22c55e;
    }

    .nav-icon {
      display: block;
      font-size: 21px;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

  <main class="app">

    <header>
      <div class="date" id="date"></div>
      <h1>Good morning 👋</h1>
      <p class="subtitle">Stay focused. Keep moving.</p>
    </header>

    <section class="progress-card">
      <div class="progress-top">
        <div>
          <div>Today's progress</div>
        </div>

        <div class="progress-number" id="progressText">
          0%
        </div>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <h2 class="section-title">Today's habits</h2>

    <section id="habitList">

      <div class="habit">
        <div class="check" onclick="completeHabit(this)"></div>
        <div class="name">Study for 30 minutes</div>
      </div>

      <div class="habit">
        <div class="check" onclick="completeHabit(this)"></div>
        <div class="name">Exercise</div>
      </div>

      <div class="habit">
        <div class="check" onclick="completeHabit(this)"></div>
        <div class="name">Read</div>
      </div>

    </section>

    <button class="add-button" onclick="addHabit()">
      + Add Habit
    </button>

  </main>

  <nav class="bottom-nav">

    <div class="nav-item active">
      <span class="nav-icon">🏠</span>
      Home
    </div>

    <div class="nav-item">
      <span class="nav-icon">🕌</span>
      Prayer
    </div>

    <div class="nav-item">
      <span class="nav-icon">📊</span>
      Progress
    </div>

    <div class="nav-item">
      <span class="nav-icon">⚙️</span>
      Settings
    </div>

  </nav>

  <script>

    // Today's date
    const today = new Date();

    document.getElementById("date").textContent =
      today.toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric"
      });


    // Complete habit
    function completeHabit(check) {

      const habit = check.parentElement;

      habit.classList.toggle("completed");

      updateProgress();
    }


    // Update progress
    function updateProgress() {

      const habits = document.querySelectorAll(".habit");

      const completed =
        document.querySelectorAll(".habit.completed").length;

      const total = habits.length;

      const percentage =
        total === 0 ? 0 : Math.round((completed / total) * 100);

      document.getElementById("progressText").textContent =
        percentage + "%";

      document.getElementById("progressFill").style.width =
        percentage + "%";
    }


    // Add a new habit
    function addHabit() {

      const name = prompt("What habit do you want to add?");

      if (!name || name.trim() === "") return;

      const habit = document.createElement("div");

      habit.className = "habit";

      habit.innerHTML = `
        <div class="check" onclick="completeHabit(this)"></div>
        <div class="name">${name}</div>
      `;

      document.getElementById("habitList").appendChild(habit);

      updateProgress();
    }

  </script>

</body>
</html>
