<script>
const BASE_KEY='toyou_phase5_v1';
let KEY=BASE_KEY;
const SUPABASE_URL=window.TOYOU_SUPABASE_URL||'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY=window.TOYOU_SUPABASE_ANON_KEY||'YOUR_SUPABASE_ANON_KEY';

let sb=REAL_AUTH?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let authReady=!sb;
const fresh={profile:{id:'',name:'',email:'',avatar:'',provider:'',accent:'#718c73',visualMode:'classic'},partner:null,screen:'home',theme:'light',tour:false,auth:false,demo:false,signup:false,connected:false,connectionCode:'',habits:[],habitCompletions:{},tasks:[],taskCompletions:{},goals:[],sharedGoals:[],dhikr:0,dhikrDate:'',dhikrCounts:{astaghfirullah:0,subhanallah:0,alhamdulillah:0,la_ilaha_illallah:0},prayer:{Fajr:true,Dhuhr:true,Asr:true,Maghrib:true,Isha:true},hadithLearned:[],dailyHadith:null,hadithCourse:[],quran:{goal:'',progress:0},quranUsDaily:null,quranUsProgress:[],quranUsAyahs:[],courses:[],courseReviews:[],journey:[],journeyMilestones:[],future:[],notes:[],reflections:[],achievements:[],needSent:false,notifications:[],suggestions:[],search:'',settings:{notifications:true,dark:false}};
const demoSeed={habits:[{id:'h1',name:'Study for 30 minutes',frequency:'Daily'},{id:'h2',name:'Exercise',frequency:'Daily'},{id:'h3',name:'Read',frequency:'Daily'}],tasks:[{id:'t1',title:"Finish today's work",date:todayKey()},{id:'t2',title:'Review notes',date:todayKey()}],goals:[{id:'g1',title:'Become a better version of myself',progress:42,target:'2027-01-01'},{id:'g2',title:'Build something real',progress:25,target:'2026-12-31'}],quran:{goal:'Read 10 pages a day',progress:4},courses:[{id:'c1',owner:'me',name:'Web Development',progress:35,status:'In progress'}],journey:[{id:'j1',date:'2024-01-01',title:'The day we met',type:'past',desc:'A meaningful beginning.',photo:''}],future:[{id:'f1',title:'Education',desc:'Keep building knowledge.'},{id:'f2',title:'Career',desc:'Become capable of creating real things.'}],dhikr:37,hadithLearned:[1],achievements:['demo'],partner:{name:'Demo Her',email:'her@demo.toyou.app',avatar:'',provider:'demo'},connected:true};
let s=load();
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){
  let out;
  try{out=Object.assign(clone(fresh),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{out=clone(fresh)}
  if(out.dhikrDate!==todayKey()){
    out.dhikr=0;
    out.dhikrCounts={astaghfirullah:0,subhanallah:0,alhamdulillah:0,la_ilaha_illallah:0};
    out.dhikrDate=todayKey();
  }
  out.dhikrCounts=Object.assign({astaghfirullah:0,subhanallah:0,alhamdulillah:0,la_ilaha_illallah:0},out.dhikrCounts||{});
  if(!out.dhikrCounts.astaghfirullah&&out.dhikr)out.dhikrCounts.astaghfirullah=out.dhikr;
  out.dhikr=Object.values(out.dhikrCounts).reduce((a,b)=>a+b,0);
  return out
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}
function switchUserStorage(uid){
  if(!uid){KEY=BASE_KEY;return load()}
  const next=BASE_KEY+':'+uid;
  if(!localStorage.getItem(next)){
    try{
      const legacy=JSON.parse(localStorage.getItem(BASE_KEY)||'null');
      if(legacy?.profile?.id===uid)localStorage.setItem(next,JSON.stringify(legacy));
    }catch{}
  }
  KEY=next;
  return load();
}

async function cloudUpsert(table,row,options){
  if(!sb||!s.auth)return null;
  const r=await sb.from(table).upsert(row,options||{});
  if(r.error)toast('Sync error: '+r.error.message);

}
async function cloudDelete(table,id,filters={}){
  if(!sb||!s.auth)return null;
  let q=sb.from(table).delete().eq('id',id);
  Object.entries(filters).forEach(([k,v])=>{if(v!==undefined&&v!==null)q=q.eq(k,v)});
  const r=await q.select('id');
  if(r.error){toast('Sync error: '+r.error.message);return r.error}
  if(!r.data||r.data.length===0){
    const check=await sb.from(table).select('id').eq('id',id).maybeSingle();
    if(!check.error&&check.data){const err=new Error('Delete was not applied');toast('Delete could not be saved to the database');return err}
  }
  return null;
}

function hadithDisplay(h){
  const source=(h?.english||'').replace(/\s+/g,' ').trim();
  const m=source.match(/^Narrated\s+([^:]+):\s*(.*)$/i);
  const narrator=(m?.[1]||'').trim();
  let body=(m?.[2]||source).trim();
  const quote=body.match(/(?:Allah's Messenger|Messenger of Allah|The Prophet(?: Muhammad)?)(?:\s*\(ﷺ\))?\s+(?:said|saying|says)[,:]?\s*[“"]([^”"]+)[”"]/i);
  if(quote?.[1]) body=quote[1].trim();
  return {narrator:narrator||'Companion narrator',body};
}
function hadithExcerpt(h,max=250){
  const d=hadithDisplay(h);let body=d.body;
  if(body.length>max) body=body.slice(0,max).replace(/\s+\S*$/,'')+'…';

}

async function hadithTogether(){
  // Always load the full course directly from Supabase so the page cannot stay stuck on the old 2-item local cache.
  if(sb){
    const {data,error}=await sb.from('hadiths').select('*').gte('course_day',1).lte('course_day',365).order('course_day',{ascending:true}).limit(365);
    if(error){toast('Could not load the 365 Hadith course: '+error.message);return}

async function challengeAnswer(id,i){
  const selected=String.fromCharCode(65+i);
  let correct=selected==='B';
  if(sb&&s.auth){
    const q=await sb.from('deen_challenges').select('correct_option').eq('id',id).maybeSingle();
    if(q.error){toast('Could not load the challenge answer: '+q.error.message);return}
    if(q.data?.correct_option)correct=selected===q.data.correct_option;
    const err=await cloudUpsert('deen_challenge_attempts',{id:crypto.randomUUID(),user_id:s.profile.id,challenge_id:id,selected_option:selected,correct});
    if(err)return;
  }
  closeSheet();openSheet(modal('Answer',`<div class="pill">${correct?'Correct ✓':'Review this one'}</div><p>${correct?'That answer matches the saved challenge answer.':'Review the learned material and try to remember the principle behind it.'}</p><p class="muted">Based on the learned material.</p><button class="btn" style="width:100%" onclick="closeSheet()">Continue</button>`))
}
function courseStatus(progress){return progress>=100?'Complete':progress<=0?'Not started':'In progress'}
function scheduleLabel(days){
  const n=Math.max(1,Math.min(7,+days||7));
  return n===7?'Every day':n+' day'+(n===1?'':'s')+' per week';
}
function courseTargetDate(start,duration,daysPerWeek=7){
  if(!start||!duration)return '';
  const weeks=Math.ceil(+duration/Math.max(1,Math.min(7,+daysPerWeek||7)));
  const d=new Date(start+'T00:00:00');d.setDate(d.getDate()+weeks*7-1);return localDateKey(d);
}
function coursePlanLabel(c){
  const bits=[];if(c.durationDays)bits.push(c.durationDays+' days');if(c.daysPerWeek)bits.push(scheduleLabel(c.daysPerWeek));return bits.join(' · ')||'Plan not set';
}

async function deleteCourse(id){
  const c=s.courses.find(x=>x.id===id);if(!c||c.owner!=='me')return;if(!confirm('Delete this course and its reviews?'))return;
  const reviewIds=(s.courseReviews||[]).filter(r=>r.courseId===id&&r.userId===s.profile.id).map(r=>r.id);
  for(const rid of reviewIds){const re=await cloudDelete('course_reviews',rid,{user_id:s.profile.id});if(re)return}
  const err=await cloudDelete('courses',id,{user_id:s.profile.id});if(err)return;
  s.courses=s.courses.filter(x=>x.id!==id);s.courseReviews=(s.courseReviews||[]).filter(r=>r.courseId!==id);save();render();toast('Course deleted');
}

function milestoneLabel(m){
  if(m.kind==='birthday')return m.targetUserId===s.profile.id?'My Birthday':m.targetUserId===s.partner?.id?'Her Birthday':'Birthday';
  if(m.kind==='day_we_met')return 'Day We Met';
  return m.title||'Remembered date';
}
function milestoneNextDate(date,repeatYearly){
  const base=new Date((date||todayKey())+'T00:00:00'),now=new Date();if(!repeatYearly)return base;
  let next=new Date(now.getFullYear(),base.getMonth(),base.getDate());if(next<new Date(now.getFullYear(),now.getMonth(),now.getDate()))next.setFullYear(next.getFullYear()+1);return next;
}
function milestoneDaysAway(date,repeatYearly){const next=milestoneNextDate(date,repeatYearly),today=new Date();today.setHours(0,0,0,0);return Math.round((next-today)/86400000)}

async function hydrateQuranUs(){
  if(!sb||!s.auth||!s.connected||!s.partner?.coupleId)return;
  const date=todayKey(),start=new Date();start.setDate(start.getDate()-365),monthStart=new Date(new Date().getFullYear(),new Date().getMonth(),1);
  const [daily,progress,ayahs,restores]=await Promise.all([
    sb.from('quran_muraajaah_daily').select('*').eq('couple_id',s.partner.coupleId).eq('quran_date',date).maybeSingle(),
    sb.from('quran_muraajaah_progress').select('*').eq('couple_id',s.partner.coupleId).gte('quran_date',localDateKey(start)).order('quran_date',{ascending:false}),
    sb.from('quran_ayah_notes').select('*').eq('couple_id',s.partner.coupleId).order('created_at',{ascending:false}).limit(50),
    sb.from('quran_muraajaah_restores').select('id',{count:'exact',head:true}).eq('user_id',s.profile.id).gte('created_at',monthStart.toISOString())
  ]);
  if(!daily.error)s.quranUsDaily=daily.data||{couple_id:s.partner.coupleId,quran_date:date,target_pages:3};else toast('Could not load today’s Qur’an target: '+daily.error.message);

async function ensureQuranDaily(date=todayKey()){

  const row={id:crypto.randomUUID(),couple_id:s.partner.coupleId,quran_date:date,target_pages:3},r=await sb.from('quran_muraajaah_daily').upsert(row,{onConflict:'couple_id,quran_date'});
  if(r.error){toast('Could not create Qur’an target: '+r.error.message);return false}
  if(date===todayKey())s.quranUsDaily=Object.assign({target_pages:3},s.quranUsDaily||{},row,{couple_id:s.partner.coupleId,quran_date:date,target_pages:3});
  return true;

function quranStreakFor(userId){
  const done=new Set((s.quranUsProgress||[]).filter(x=>x.user_id===userId&&x.pages_completed===3).map(x=>x.quran_date));let d=new Date();
  if(!done.has(localDateKey(d)))d.setDate(d.getDate()-1);
  let n=0;for(let i=0;i<800;i++){const key=localDateKey(d);if(!done.has(key))break;n++;d.setDate(d.getDate()-1)}return n;
}
function quranBestStreakFor(userId){
  const done=[...new Set((s.quranUsProgress||[]).filter(x=>x.user_id===userId&&x.pages_completed===3).map(x=>x.quran_date))].sort();let best=0,run=0,prev=null;
  done.forEach(k=>{const d=new Date(k+'T00:00:00');if(prev&&Math.round((d-prev)/86400000)===1)run++;else run=1;if(run>best)best=run;prev=d});return best;
}
function quranStreakRestoresLeft(){return Math.max(0,3-(s.quranMuraajaahRestoresUsed||0))}
function quranStreakDayStrip(userId){

async function restoreQuranMuraajaah(){

  if(!(s.quranUsProgress||[]).some(x=>x.user_id===s.profile.id&&x.quran_date===beforeKey&&x.pages_completed===3))return toast('No recent broken Qur’an streak to restore');
  if(!await ensureQuranDaily(missed))return;

  if(prog.error){await sb.from('quran_muraajaah_restores').delete().eq('id',ins.data?.id);return toast('Could not save restored Qur’an progress: '+prog.error.message)}

async function hadithTogether(){
  // Always load the full course directly from Supabase so the page cannot stay stuck on the old 2-item local cache.
  if(sb){
    const {data,error}=await sb.from('hadiths').select('*').gte('course_day',1).lte('course_day',365).order('course_day',{ascending:true}).limit(365);
    if(error){toast('Could not load the 365 Hadith course: '+error.message);return}
    if(data&&data.length){s.hadithCourse=data;save();}
  }
  const course=(s.hadithCourse||[]).filter(x=>x.course_day>=1&&x.course_day<=365).sort((a,b)=>a.course_day-b.course_day);
  if(course.length<365){toast('Hadith course loaded: '+course.length+'/365');}
  s.screen='hadithTogether';save();render();
}

  const course=(s.hadithCourse||[]).filter(x=>x.course_day>=1&&x.course_day<=365).sort((a,b)=>a.course_day-b.course_day);
  const learned=new Set(s.hadithLearned||[]);
  return '<main class="page"><button class="back" onclick="go(\'deenTogether\')">‹ Deen Together</button><div class="row"><div><h1 style="margin-bottom:3px">365 Hadith</h1><div class="muted">All days in one place · Sahih al-Bukhari & Sahih Muslim</div></div><span class="pill">'+learned.size+'/365</span></div><div class="progress" style="margin:12px 0 16px"><i style="width:'+Math.min(100,Math.round(learned.size/365*100))+'%"></i></div>'+(course.length?course.map(function(h){
    const done=h.id&&learned.has(h.id);
    return '<section class="card"><div class="row"><span class="pill">Day '+h.course_day+' of 365</span><span class="pill">'+esc(h.collection==='sahih_muslim'?'Sahih Muslim':'Sahih al-Bukhari')+'</span></div><h3 style="margin-bottom:8px">'+esc(h.arabic||'')+'</h3>'+(h.transliteration?'<p><em>'+esc(h.transliteration)+'</em></p>':'')+'<p>“'+esc(h.english||'')+'”</p><div class="muted small">Reference: '+esc(h.reference||'')+'</div><button class="btn '+(done?'secondary':'')+'" style="width:100%;margin-top:12px" onclick="'+(h.id?'markHadithLearned(\''+h.id+'\')':'toast(\'Hadith is ready for review\')')+'">'+(done?'Learned ✓':'Mark learned')+'</button></section>';
  }).join(''):'<div class="empty">The verified 365-day hadith course is not fully loaded yet.</div>')+'</main>';
}
const SUGGESTION_PRESETS=[
  ['start','⏰','Start something','Start one small habit that makes tomorrow easier.'],
  ['learn','📚','Learn something','Learn one useful thing that strengthens your skills or knowledge.'],
  ['move','🏃','Move your body','Take a short walk, stretch, or do a simple workout.'],
  ['finish','✅','Finish one thing','Choose one small unfinished thing and close the loop.'],
  ['stop','🛑','Stop one thing','Drop or reduce one habit that is getting in the way of your growth.']
];
function suggestionTargetLabel(){
  return s.profile.visualMode==='girl'?'your man':'your girl';
}
function suggestionFromMeLabel(){
  return s.profile.visualMode==='girl'?'Suggest your man':'Suggest your girl';
}
function openSuggestions(){
  const mine=(s.suggestions||[]).filter(x=>x.senderId===s.profile.id),received=(s.suggestions||[]).filter(x=>x.recipientId===s.profile.id);
  const target=esc(suggestionTargetLabel());
  const sentCards=mine.length?mine.map(suggestionCard).join(''):'<div class="empty">No suggestions sent yet.</div>';
  const receivedCards=received.length?received.map(suggestionCard).join(''):'<div class="empty">No suggestions for you yet.</div>';
  openSheet(modal('Suggestions','<p class="muted">Suggestions only — no chat thread, no pressure.</p><button class="btn" style="width:100%" '+(s.connected?'':'disabled')+' onclick="'+(s.connected?'closeSheet();openNewSuggestion()':"toast('Connect first')")+'">'+(s.connected?esc('💡 '+suggestionFromMeLabel()):'Connect first')+'</button><h3 class="sectionTitle">For '+target+'</h3>'+sentCards+'<h3 class="sectionTitle">Suggested to you</h3>'+receivedCards));
}
function suggestionCard(x){
  const mine=x.senderId===s.profile.id,who=mine?('To '+(s.partner?.name||'her')):('From '+(s.partner?.name||'him')),status=x.status||'open';
  return '<section class="item suggestionItem"><div class="row"><div><span class="pill">'+esc(x.category||'growth')+'</span><h3 style="margin:8px 0 4px">'+esc(x.title)+'</h3></div><span class="muted small">'+who+'</span></div><div class="muted">'+esc(x.reason||'Suggested for growth.')+'</div><div class="row" style="margin-top:10px"><span class="pill">'+esc(status)+'</span>'+(mine?'<button class="icon" title="Delete suggestion" onclick="deleteSuggestion(\''+x.id+'\')">×</button>':status==='open'?'<div class="grid2" style="gap:6px"><button class="btn secondary" onclick="setSuggestionStatus(\''+x.id+'\',\'done\')">Useful ✓</button><button class="btn ghost" onclick="setSuggestionStatus(\''+x.id+'\',\'dismissed\')">Not now</button></div>':'')+'</div></section>';
}
function openNewSuggestion(preset=''){
  if(!s.connected||!s.partner?.id||!s.partner?.coupleId)return toast('Connect first');
  const buttons=SUGGESTION_PRESETS.map(function(x){return '<button class="suggestionPreset '+(preset===x[0]?'selected':'')+'" onclick="fillSuggestionPreset(\''+x[0]+'\')"><span class="milestoneCircle">'+x[1]+'</span><span><strong>'+x[2]+'</strong><small>'+x[3]+'</small></span></button>'}).join('');
  openSheet(modal(suggestionFromMeLabel(),' <p class="muted">Give '+esc(suggestionTargetLabel())+' one useful idea. Keep it simple and kind.</p><div class="suggestionPresetGrid">'+buttons+'</div><div class="field"><label>Suggestion</label><input id="suggestionTitle" placeholder="e.g. Start waking up 15 minutes earlier"></div><div class="field"><label>Why</label><textarea id="suggestionReason" placeholder="Why do you think this would help?"></textarea></div><button class="btn" style="width:100%" onclick="sendSuggestion()">Send suggestion</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Cancel</button>'));
  if(preset)fillSuggestionPreset(preset);
}
function fillSuggestionPreset(key){
  const p=SUGGESTION_PRESETS.find(x=>x[0]===key);if(!p)return;
  const title=document.getElementById('suggestionTitle'),reason=document.getElementById('suggestionReason');if(title)title.value=p[2];if(reason)reason.value=p[3];
  document.querySelectorAll('.suggestionPreset').forEach(x=>x.classList.remove('selected'));
  const chosen=document.querySelector('.suggestionPreset[data-key="'+key+'"]');if(chosen)chosen.classList.add('selected');
}
async function sendSuggestion(){
  const title=document.getElementById('suggestionTitle')?.value.trim()||'',reason=document.getElementById('suggestionReason')?.value.trim()||'';
  if(!title)return toast('Add a suggestion');
  const id=crypto.randomUUID(),row={id,couple_id:s.partner.coupleId,sender_id:s.profile.id,recipient_id:s.partner.id,category:'growth',title,reason,status:'open'};
  const err=await cloudUpsert('relationship_suggestions',row);if(err)return;
  s.suggestions=[{id,coupleId:row.couple_id,senderId:row.sender_id,recipientId:row.recipient_id,category:row.category,title,reason,status:'open',createdAt:new Date().toISOString()},...(s.suggestions||[])];
  save();closeSheet();openSuggestions();toast('Suggestion sent ✓');
}
async function setSuggestionStatus(id,status){
  const x=(s.suggestions||[]).find(v=>v.id===id);if(!x||x.recipientId!==s.profile.id)return;
  if(!sb||!s.auth)return toast('Sign in first');const result=await sb.from('relationship_suggestions').update({status,updated_at:new Date().toISOString()}).eq('id',x.id).eq('recipient_id',s.profile.id);if(result.error){toast('Could not update suggestion: '+result.error.message);return}
  x.status=status;save();closeSheet();openSuggestions();toast(status==='done'?'Suggestion marked useful ✓':'Suggestion parked');
}
async function deleteSuggestion(id){
  const x=(s.suggestions||[]).find(v=>v.id===id);if(!x||x.senderId!==s.profile.id)return;
  if(!confirm('Delete this suggestion?'))return;
  const err=await cloudDelete('relationship_suggestions',id);if(err)return;
  s.suggestions=(s.suggestions||[]).filter(v=>v.id!==id);save();closeSheet();render();toast('Suggestion deleted');
}

function familyLater(){
  openSheet(modal('Family','<div class="center"><div class="big">😂</div><h3>Okay, okay…</h3><div class="stack" style="text-align:left;margin-top:12px"><div class="item">😭 I know this topic can make you uncomfortable sometimes.</div><div class="item">😂 So I removed the awkward stuff instead of making it a whole section.</div><div class="item">🫡 Family planning can wait for the right chapter.</div><div class="item">📦 Future-you can open this box when the time is right.</div></div><button class="btn secondary" style="width:100%;margin-top:12px" onclick="closeSheet()">Fair enough 😂</button></div>'));
}
function future(){
  const shared=(s.sharedGoals||[]).filter(g=>['marriage','family','money','education','career','character','deen','future'].includes(g.category||'future'));
  const areas=[
    ['🕌','Deen','deen'],
    ['🎓','Education','education'],
    ['🧭','Career','career'],
    ['💰','Financial preparation','money'],
    ['🌱','Character & discipline','character'],
    ['💍','Marriage preparation','marriage'],
    ['🤝','Relationship → marriage','relationship']
  ];
  const cards=areas.map(a=>'<button class="suggestionPreset" onclick="futureArea(\''+a[2]+'\')"><span class="milestoneCircle">'+a[0]+'</span><span><strong>'+a[1]+'</strong><small>Open</small></span></button>').join('');
  const goals=shared.length?shared.map(g=>'<section class="card"><div class="row"><div><strong>'+esc(g.title)+'</strong><div class="muted">'+esc(g.category||'future')+(g.target?' · '+esc(g.target):'')+'</div></div><span>'+Math.round(g.progress||0)+'%</span></div><div class="progress" style="margin-top:10px"><i style="width:'+Math.max(0,Math.min(100,g.progress||0))+'%"></i></div><div class="row" style="margin-top:10px"><span class="pill">'+(g.progress>=100?'Complete':g.progress===0?'Not started':'In progress')+'</span><button class="btn secondary" onclick="editSharedGoal(\''+g.id+'\')">Manage</button></div></section>').join(''):'<div class="empty">No Before Marriage goals yet.</div>';
  return '<main class="page"><button class="back" onclick="go(\'us\')">‹ Us</button><div class="row"><div><div class="eyebrow">ME + HER → FUTURE</div><h1 style="margin:0">Before Marriage</h1><div class="muted" style="margin-top:4px">What you build before the future arrives.</div></div></div><section class="card"><strong>Build before marriage</strong><div class="muted">Pick an area and turn it into real work.</div><div class="suggestionPresetGrid" style="margin-top:12px">'+cards+'</div></section>'+goals+'<section class="card center"><button class="btn ghost" style="width:100%" onclick="familyLater()">👨‍👩‍👧 Family · later</button></section></main>';
}
function futureArea(category){
  const map={
    deen:{icon:'🕌',title:'Deen',text:'Prayer, Qur’an, hadith, character, and beneficial Islamic learning.'},
    education:{icon:'🎓',title:'Education',text:'Build knowledge, finish your studies, and keep learning useful things.'},
    career:{icon:'🧭',title:'Career',text:'Build skills, create real things, and become capable before the next chapter.'},
    money:{icon:'💰',title:'Financial preparation',text:'Learn earning, saving, responsible spending, and future responsibility.'},
    character:{icon:'🌱',title:'Character & discipline',text:'Practice patience, honesty, discipline, responsibility, and good character.'},
    marriage:{icon:'💍',title:'Marriage preparation',text:'Learn the responsibilities, expectations, rights, duties, and practical preparation that come with marriage.'},
    relationship:{icon:'🤝',title:'Relationship → marriage',text:'Keep things purposeful and respectful, with the goal of becoming ready for a halal future.'}
  };
  const x=map[category]||map.character;
  openSheet(modal(x.icon+' '+x.title,'<div class="center"><div class="big">'+x.icon+'</div><h3>'+x.title+'</h3><p class="muted">'+x.text+'</p><button class="btn" style="width:100%" onclick="closeSheet();addSharedGoal(\''+(category==='relationship'?'marriage':category)+'\',\''+x.title+'\')">＋ Add a shared goal</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Close</button></div>'));
}
function journeyPage(){
  const milestones=[...(s.journeyMilestones||[])].sort((a,b)=>milestoneNextDate(a.date,a.repeatYearly)-milestoneNextDate(b.date,b.repeatYearly));
  const events=[...(s.journey||[])].sort((a,b)=>a.date.localeCompare(b.date));
  const chips=milestones.length?milestones.map(m=>'<button class="milestoneChip" onpointerdown="startMilestoneHold(event,\''+m.id+'\')" onpointerup="clearMilestoneHold()" onpointerleave="clearMilestoneHold()" onpointercancel="clearMilestoneHold()"><span class="milestoneCircle">'+esc(m.icon)+'</span><span><strong>'+esc(milestoneLabel(m))+'</strong><small>'+esc(m.date)+'</small></span></button>').join(''):'<div class="empty">No remembered dates yet.</div>';
  const eventCards=events.length?events.map(j=>'<section class="card" onpointerdown="startJourneyHold(event,\''+j.id+'\')" onpointerup="clearJourneyHold()" onpointerleave="clearJourneyHold()" onpointercancel="clearJourneyHold()"><div class="row"><span class="pill">'+esc(j.type)+'</span><span class="muted">'+esc(j.date)+'</span></div><h3>'+esc(j.title)+'</h3><div class="muted">'+esc(j.desc)+'</div>'+(j.photo?'<img class="journeyPhoto" src="'+esc(j.photo)+'" alt="Journey photo">':'')+'<div class="muted small center pressHint">Long press for Edit · Delete · Cancel</div></section>').join(''):'<section class="card empty">No memories yet. Add the moments you want to keep.</section>';
  return '<main class="page"><button class="back" onclick="go(\'us\')">‹ Us</button><div class="row"><div><h1>Our Journey</h1><div class="muted">Memories, milestones, and the dates worth remembering.</div></div><button class="btn secondary" onclick="addJourney()">+ Memory</button></div><section class="card"><div class="row"><div><strong>Remembered dates</strong><div class="muted">Small circles for birthdays, the day you met, and other dates you want to keep.</div></div><button class="btn secondary" onclick="addMilestone()">+ Date</button></div><div class="milestoneList" style="margin-top:12px">'+chips+'</div></section><div class="pill">Past · Present · Future</div>'+eventCards+'</main>';
}
function notes(){return '<main class="page"><div class="row"><h1>Notes</h1><button class="btn secondary" onclick="addNote()">+ New</button></div>'+(s.notes.length?s.notes.map(n=>'<section class="card"><div class="row"><strong>'+esc(n.title)+'</strong><button class="icon" title="Delete note" onclick="deleteNote(\''+n.id+'\')">×</button></div><p class="muted">'+esc(n.body)+'</p></section>').join(''):'<div class="empty">Private notes live here.</div>')+'</main>'}
function searchPage(){let q=s.search.toLowerCase();let all=[...s.habits.map(x=>({t:x.name,c:'Habit'})),...s.tasks.map(x=>({t:x.title,c:'Task'})),...s.goals.map(x=>({t:x.title,c:'Goal'})),...s.courses.map(x=>({t:x.name,c:'Course'})),...s.journey.map(x=>({t:x.title,c:'Journey'})),...s.notes.map(x=>({t:x.title,c:'Note'}))];let r=all.filter(x=>!q||x.t.toLowerCase().includes(q));return `<main class="page"><h1>Search</h1><div class="field"><input id="searchInput" value="${esc(s.search)}" oninput="search()" placeholder="Search habits, tasks, goals, courses, journey..."></div>${r.map(x=>`<div class="item" style="margin:8px 0"><strong>${esc(x.t)}</strong><div class="muted">${x.c}</div></div>`).join('')||'<div class="empty">Nothing found.</div>'}</main>`}
async function persistPreferences(){
  if(!sb||!s.auth)return;
  const {error}=await sb.from('profiles').update({
    visual_mode:s.profile.visualMode||'classic',
    dark_mode:s.theme==='dark',
    notifications:!!s.settings.notifications,
    updated_at:new Date().toISOString()
  }).eq('id',s.profile.id);
  if(error)toast('Settings could not sync: '+error.message);
}
async function setThemeMode(){s.theme=s.theme==='dark'?'light':'dark';save();render();await persistPreferences()}
async function setVisualMode(mode){s.profile.visualMode=mode==='girl'?'girl':mode==='ocean'?'ocean':'classic';save();render();await persistPreferences()}
async function setNotifications(){if(!s.settings.notifications){const ok=await enableNotifications();if(!ok)return}else{s.settings.notifications=false;save();render()}await persistPreferences()}
function settings(){return `<main class="page"><h1>Settings</h1><section class="card"><div style="display:flex;align-items:center;gap:12px">${avatar(s.profile.name,s.profile.avatar)}<div><strong>${esc(s.profile.name||'Your profile')}</strong><div class="muted">${esc(s.profile.email||'')}</div></div></div><button class="btn secondary" style="width:100%;margin-top:12px" onclick="profile()">Edit profile</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="signOut()">Sign out</button></section><section class="card"><strong>Appearance</strong><div class="row" style="margin-top:12px"><span>Use dark appearance</span><button class="toggle ${s.theme==='dark'?'on':''}" onclick="setThemeMode()"><i></i></button></div><div class="field" style="margin-top:14px"><label>Personal style</label><select onchange="setVisualMode(this.value)"><option value="classic" ${s.profile.visualMode!=='girl'?'selected':''}>Classic — your current look</option><option value="girl" ${s.profile.visualMode==='girl'?'selected':''}>Soft rose — her style</option><option value="ocean" ${s.profile.visualMode==='ocean'?'selected':''}>Ocean blue — your new style</option></select></div></section><section class="card"><strong>Notifications</strong><div class="row" style="margin-top:12px"><span>Allow reminders</span><button class="toggle ${s.settings.notifications?'on':''}" onclick="setNotifications()"><i></i></button></div></section><section class="card"><strong>Special days & holidays</strong><div class="muted">Eid, birthdays, anniversaries and dates worth remembering.</div><button class="btn secondary" style="margin-top:10px;width:100%" onclick="addSpecialDay()">+ Add special day</button></section><section class="card"><strong>Connection</strong><div class="muted">${s.connected&&s.partner?'Connected with '+esc(s.partner.name):'No partner connected yet.'}</div><button class="btn secondary" style="margin-top:10px" onclick="connectSheet()">${s.connected?'Manage connection':'Connect with Her'}</button></section><section class="card"><strong>Privacy & Data</strong><div class="stack" style="margin-top:12px"><button class="btn secondary" onclick="exportData()">Export My Data</button>${s.demo?'<button class="btn danger" onclick="startDemo()">Reset Demo Data</button>':''}</div></section><section class="card"><strong>Help</strong><div class="muted">Replay the guided tour and learn every area of أمانة.</div><button class="btn ghost" style="margin-top:10px" onclick="s.tour=false;save();render()">Replay tour</button></section></main>`}
function nav(){return `<nav class="nav">${[['home','⌂','Home'],['progress','◔','Progress'],['deen','☪','Deen'],['us','♡','Us']].map(([id,i,l])=>`<button class="${s.screen===id?'active':''}" onclick="go('${id}')"><div>${i}</div>${l}</button>`).join('')}</nav>`}
function render(){document.body.classList.toggle('dark',s.theme==='dark');document.body.classList.toggle('girl-theme',s.profile.visualMode==='girl');document.body.classList.toggle('ocean-theme',s.profile.visualMode==='ocean');const app=document.getElementById('app');if(!authReady){app.innerHTML='';return}app.innerHTML=(!s.auth&&!s.demo)?authPage():(!s.tour?onboarding():header()+page()+nav())}
function page(){switch(s.screen){case'progress':return progress();case'deen':return deen();case'us':return us();case'quranTogether':return quranTogether();case'grow':return grow();case'ourg':return ourg();case'courses':return courses();case'deenTogether':return deenTogether();case'hadithTogether':return hadithTogetherPage();case'future':return future();case'journey':return journeyPage();case'notes':return notes();case'search':return searchPage();case'settings':return settings();default:return home()}}
window.addEventListener('online',function(){if(s.auth)render()});
window.addEventListener('offline',function(){if(s.auth)render()});
render();
setTimeout(()=>{if(!authReady){authReady=true;render()}hideSplash()},6500);
initAuth();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
